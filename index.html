<style>
:root{
  color-scheme:light;
  --bg:#F7F4EF; --card:#FFFFFF; --soft:#FBF9F5;
  --txt:#33302C; --mut:#7A7267; --hint:#A79E92;
  --line:#E9E3DA; --line2:#D8CFC3;
  --acc:#C97B5A; --accbg:#F4E2D9; --acctx:#8A4529;
  --blu:#4A6272; --blubg:#DFE6EB; --blutx:#2F4553;
  --grn:#5F8A7D; --grnbg:#DFEAE6; --grntx:#3A5E53;
  --amb:#A98545; --ambbg:#F0E8D8; --ambtx:#6E5522;
  --pur:#7A6A8C; --purbg:#EDE7F0; --purtx:#544763;
  --dan:#B5503F; --danbg:#FBE9E4; --dantx:#8C3325;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0 auto;max-width:1400px;background:var(--bg);color:var(--txt);
 font-family:'Josefin Sans',system-ui,-apple-system,sans-serif;font-size:13px;line-height:1.4;
 padding:18px 16px calc(60px + env(safe-area-inset-bottom));overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
h1{font-size:21px;font-weight:600;margin:0 0 1px}

/* ---------- encabezado ---------- */
.apd{font-size:12px;color:var(--mut);margin-bottom:11px}
.tabs{display:flex;align-items:center;gap:3px;margin-bottom:13px;flex-wrap:wrap}
.tab{font-size:12.5px;padding:5px 14px;border-radius:14px;border:1px solid transparent;
 background:transparent;color:var(--mut);cursor:pointer}
.tab:hover{background:var(--soft)}
.tab.on{background:var(--acc);color:#fff}
.mini{font-size:11px;padding:4px 10px;border-radius:12px;border:1px solid var(--line2);
 background:#fff;color:var(--mut);cursor:pointer;white-space:nowrap}
.mini:hover{border-color:var(--acc);color:var(--acctx)}

/* ---------- bloques base ---------- */
.pnl{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 13px;min-width:0;margin-bottom:10px}
.ph{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
 padding:3px 10px;border-radius:11px;display:inline-block}
.pnlh{display:flex;align-items:center;gap:7px;margin-bottom:8px;cursor:pointer;flex-wrap:wrap}
.pnlh .n{font-size:10px;color:var(--hint)}
.pnlh .ar{font-size:10px;color:var(--acc);margin-left:auto}
.secH{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
 padding:3px 10px;border-radius:11px;display:inline-block;margin:0 0 7px}
.add{font-size:12px;color:var(--mut);border:1px dashed var(--line2);border-radius:10px;
 padding:8px 12px;background:transparent;width:100%;text-align:left;cursor:pointer;outline:none}
.add:hover{border-color:var(--acc);color:var(--acctx)}
input.add{color:var(--txt)}
input.add::placeholder{color:var(--mut)}
.tipo{font-size:9.5px;padding:1px 7px;border-radius:9px;font-weight:500;display:inline-block;white-space:nowrap}
.lb{font-size:10px;padding:2px 8px;border-radius:10px;white-space:nowrap;display:inline-block;font-weight:500}
/* --- etiquetas de tipo --- */
.tgc{font-size:9.5px;line-height:1.7;padding:1px 6px;border-radius:9px;font-weight:500;flex:none;width:var(--tgw,58px);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgi{font-size:9.5px;line-height:1.7;padding:1px 0;border-radius:9px;font-weight:600;flex:none;width:19px;text-align:center;white-space:nowrap}
.rdot{width:7px;height:7px;border-radius:50%;flex:none}
.tgrow{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--card);margin-bottom:5px;cursor:pointer}
.tgsw{width:15px;height:15px;border-radius:4px;flex:none;border:1px solid var(--line)}
.tgnm{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgn{font-size:9.5px;color:var(--hint);flex:none}
.tgar{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:5px;width:20px;height:20px;font-size:9px;line-height:1;padding:0;flex:none;cursor:pointer;font-family:inherit}
.tgar[disabled]{opacity:.3;cursor:default}
.tgexp{border:1px solid var(--acc);border-radius:11px;background:var(--card);padding:11px;margin-bottom:5px}
.tgfl{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px}
.tgin{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-family:inherit;font-size:12.5px;background:var(--bg);color:var(--txt);outline:none}
.tgstrip{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tgchip{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);padding:0;cursor:pointer}
.tgchip.on{border:2px solid var(--txt)}
.tgchip.off{opacity:.35;cursor:not-allowed}
.tim{font-size:10px;color:var(--hint)}
.grip{color:var(--line2);font-size:13px;line-height:1;flex:none;cursor:grab;touch-action:none;user-select:none;padding:2px 1px}
.grip:active{cursor:grabbing;color:var(--acc)}

/* ---------- lista corta ---------- */
.lcrow{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:13px;
 border-bottom:1px solid var(--line);flex-wrap:wrap}
.lcrow:last-of-type{border-bottom:none}
.lcrow.dragging{opacity:.4}
.lcrow.over{box-shadow:0 -2px 0 var(--acc)}
.lcrow.faded{opacity:.5}
.lcrow.faded .rt{font-size:11.5px}
.lcrow.done .rt{text-decoration:line-through;opacity:.42}
.rc{width:17px;height:17px;border:1.5px solid var(--line2);border-radius:5px;flex:none;background:#fff;
 display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff;cursor:pointer}
.rc.on{background:var(--grn);border-color:var(--grn)}
.rt{flex:1;min-width:150px;line-height:1.3;cursor:pointer;overflow-wrap:break-word}
.rnum{font-size:9.5px;font-weight:600;color:var(--hint);width:13px;text-align:center;flex:none}
.rx{font-size:11px;color:var(--hint);cursor:pointer;flex:none;padding:0 2px}
.rx:hover{color:var(--dan)}
.full{font-size:10.5px;color:var(--ambtx);background:var(--ambbg);border-radius:0 9px 9px 0;
 border-left:3px solid var(--amb);padding:7px 10px;margin-top:8px;line-height:1.5;
 display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.lcempty{font-size:11.5px;color:var(--hint);padding:4px 0 2px;line-height:1.5}
/* selector de vista */
.vsw{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.vb{font-size:11px;padding:4px 11px;border-radius:12px;border:1px solid var(--line);
 background:#fff;color:var(--mut);cursor:pointer;white-space:nowrap}
.vb:hover{border-color:var(--acc);color:var(--acctx)}
.vb.on{background:var(--accbg);border-color:var(--acc);color:var(--acctx);font-weight:600}
/* subtítulo de grupo */
.grpH{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:.07em;
 text-transform:uppercase;padding:9px 0 5px;border-bottom:1.5px solid var(--line);margin-top:6px}
.grpH:first-child{margin-top:0}
.gdot{width:8px;height:8px;border-radius:50%;flex:none}
.gn{margin-left:auto;font-weight:400;opacity:.6;letter-spacing:0}
/* editar en la propia lista */
.hchip{font-size:10px;padding:2px 8px;border-radius:9px;border:1px solid var(--line2);
 background:#fff;color:var(--acctx);cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.hchip.vacia{color:var(--hint);border-style:dashed}
.hchip:hover{border-color:var(--acc)}
.hin{font-size:12px;width:84px;padding:3px 7px;border:1px solid var(--acc);border-radius:9px;outline:none;color:var(--txt)}
.qeb{border:none;background:transparent;color:var(--line2);font-size:14px;line-height:1;
 cursor:pointer;flex:none;padding:0 3px}
.qeb:hover,.qeb.on{color:var(--acc)}
.qe{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin:2px 0 8px}
.qerow{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
.qerow:last-child{margin-bottom:0}
.qerow>label{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;width:104px;flex:none}
.qerow input,.qerow select{font-size:12.5px;color:var(--txt);background:#fff;border:1px solid var(--line2);
 border-radius:9px;padding:5px 9px;outline:none;flex:1;min-width:120px}
.qerow input:focus,.qerow select:focus{border-color:var(--acc)}
.qerow .frow{flex:1;display:flex;gap:7px;min-width:150px}
.dchips{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.dchip{font-size:10px;padding:3px 9px;border-radius:9px;border:1px solid var(--line);
 background:#fff;color:var(--mut);cursor:pointer;white-space:nowrap}
.dchip:hover{border-color:var(--acc)}
.dchip.on{font-weight:600}
/* zonas donde puedes soltar */
.mq.over{border-color:var(--acc);border-width:1.5px;background:var(--accbg)}
.grpH.over{background:var(--accbg);border-radius:8px}
/* estrella de la matriz */
.star{border:none;background:transparent;font-size:14px;line-height:1;color:var(--line2);
 cursor:pointer;flex:none;padding:0 2px}
.star.on{color:var(--amb)}
/* matriz */
.mtx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.mq{border:1px solid var(--line);border-radius:11px;padding:4px 10px 8px;min-width:0}
.mqh{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
 padding:4px 10px;border-radius:10px;display:block;margin:6px 0 2px}
.mqd{display:block;font-size:9px;font-weight:400;letter-spacing:.02em;text-transform:none;opacity:.75;margin-top:1px}
/* por horas */
.hrrow{display:flex;align-items:center;gap:10px}
.hrt{font-size:11px;font-weight:600;color:var(--acctx);width:44px;flex:none;
 font-variant-numeric:tabular-nums;text-align:right}
.hrb{flex:1;min-width:0}
/* bloque de selección */
.fchips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:4px 10px;
 border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer}
.fchip:hover{border-color:var(--acc)}
.fchip.on{font-weight:600}
.fsec{margin-top:10px}
.fcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:6px}
/* sección en modo pasos */
.sghrow{display:flex;align-items:center;gap:7px;margin-bottom:4px;flex-wrap:wrap}
.modo{font-size:9.5px;padding:2px 9px;border-radius:9px;border:1px solid var(--line);
 background:transparent;color:var(--hint);cursor:pointer;letter-spacing:.04em;text-transform:uppercase}
.modo.on{background:var(--accbg);border-color:var(--acc);color:var(--acctx);font-weight:600}
.pasos{padding:4px 0 2px}
.step{display:flex;gap:11px;position:relative;padding-bottom:10px;align-items:flex-start}
.step .line{position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.step.done .line{background:var(--grn);opacity:.4}
.step .num{width:27px;height:27px;border-radius:50%;flex:none;display:flex;align-items:center;
 justify-content:center;font-size:12px;font-weight:600;border:2px solid var(--line2);
 color:var(--hint);background:#fff;cursor:pointer;z-index:1}
.step.done .num{background:var(--grn);border-color:var(--grn);color:#fff}
.step.cur .num{border-color:var(--acc);color:var(--acctx);border-width:2.5px}
.step .sbody{flex:1;min-width:0;padding-top:4px}
.step .stx{font-size:13px;line-height:1.3;cursor:pointer;word-break:break-word}
.step.done .stx{text-decoration:line-through;opacity:.45}
.step.cur .stx{font-weight:600}
.substep{display:flex;gap:7px;align-items:center;font-size:11.5px;padding:3px 0;color:var(--mut)}
.substep.done span:last-child{text-decoration:line-through;opacity:.5}

/* ---------- avisos y tira de días ---------- */
.alert{border-radius:0 10px 10px 0;padding:9px 12px;font-size:12px;display:flex;gap:9px;
 align-items:center;flex-wrap:wrap;margin-bottom:10px}
.alert.dan{background:var(--danbg);border-left:3px solid var(--dan);color:var(--dantx)}
.alert.amb{background:var(--ambbg);border-left:3px solid var(--amb);color:var(--ambtx)}
.alert.blu{background:var(--blubg);border-left:3px solid var(--blu);color:var(--blutx)}

function widgetBlob(){
 const meta=tk=>{const a=areaObjOf(tk),c=colOf(a);
   const o={t:txtOf(tk),b:a.name,c:c.sol,f:dateOf(tk)||'',h:timeOf(tk)||''};
   const g=tgBlob(tk.id);if(g)o.g=g;return o;};
 const corta=[];
 short.forEach(e=>{
   if(corta.length>=8)return;
   if(e.free){if(!e.done)corta.push({t:e.t,b:'',c:'#8A7263',f:'',h:e.hora||''});return;}
   const tk=tkById(e.id);if(!tk||state[tk.id]||archived[tk.id])return;
   corta.push(meta(tk));});
 const ahora=Date.now();
 const conHora=TK().filter(t=>activo(t)&&parseDT(t)&&parseDT(t).getTime()>ahora-3600000)
   .sort((a,b)=>parseDT(a)-parseDT(b)).slice(0,6).map(meta);
 const hoyMan=TK().filter(t=>{if(!activo(t))return false;const d=dateOf(t);if(!d)return false;
   return dayDiff(d)<=1;}).sort((a,b)=>dayDiff(dateOf(a))-dayDiff(dateOf(b))).slice(0,8).map(meta);
 const atras=TK().filter(t=>activo(t)&&overdue(t)).length;

 /* cuadrantes de la matriz, con lo que tú arrastraste ya respetado */
 const QN=['Hazlo ya','Agéndalo','Sácatelo rápido','¿De verdad?'];
 const cuad=QN.map(n=>({n:n,c:0,it:[]}));
 short.forEach(e=>{
   let t='',col='#8A7263';
   if(e.free){if(e.done)return;t=e.t;}
   let gg=null;
   if(!e.free){const tk=tkById(e.id);if(!tk||state[tk.id]||archived[tk.id])return;
        t=txtOf(tk);col=colOf(areaObjOf(tk)).sol;gg=tgBlob(tk.id);}
   const q=quadDe(e);cuad[q].c++;
   if(cuad[q].it.length<3){const o={t:t,c:col};if(gg)o.g=gg;cuad[q].it.push(o);}});

 /* los próximos días, para la tira de la semana */
 const semana=[];
 for(let i=0;i<6;i++){const dd=addDays(todayStr(),i);
   const ev=TK().filter(t=>activo(t)&&dateOf(t)===dd&&timeOf(t))
     .sort((a,b)=>(parseDT(a)||0)-(parseDT(b)||0)).slice(0,2)
     .map(t=>{const o={h:timeOf(t),t:txtOf(t)};const g=tgBlob(t.id);if(g)o.g=g;return o;});
   semana.push({d:dd,ev:ev});}

 /* cada bloque con sus secciones — para los widgets por bloque */
 const bloques=[];
 areas().forEach(a=>{
   if(hiddenB[a.key])return;
   const c=colOf(a);
   const mias=TK().filter(t=>areaOf(t)===a.key&&activo(t));
   if(a.inbox&&!mias.length)return;
   const secs=[];
   sgNames(a).slice(0,6).forEach(sg=>{
     const todas=tasksFor(a.key,sg);
     if(!todas.length)return;
     secs.push({n:labelOv[a.key+'|'+sg]||sg,p:!!stepMode[a.key+'|'+sg],
       ts:todas.slice(0,7).map(tk=>{const o={t:txtOf(tk),f:dateOf(tk)||'',h:timeOf(tk)||'',d:!!state[tk.id]};
         const g=tgBlob(tk.id);if(g)o.g=g;return o;})});});
   bloques.push({k:a.key,n:a.name,c:c.sol,bg:c.bg,tx:c.tx,
     pend:mias.length,venc:mias.filter(overdue).length,
     sem:mias.filter(t=>{const d=dateOf(t);if(!d)return false;const n=dayDiff(d);return n>=0&&n<=7;}).length,
     secs:secs});});

 const hechas=doneToday();
 const porHacerHoy=TK().filter(t=>{if(!activo(t))return false;const d=dateOf(t);return !!(d&&dayDiff(d)<=0);}).length;

 return {v:2,ts:new Date().toISOString(),atrasadas:atras,
         pendientes:TK().filter(activo).length,
         hoyHechas:hechas,hoyTotal:hechas+porHacerHoy,
         corta:corta,conHora:conHora,hoyManana:hoyMan,
         cuadrantes:cuad,semana:semana,bloques:bloques,
         etiquetas:tags.map(t=>{const c=tagPal(t);
           return {id:t.id,n:t.n,i:tagIni(t),bg:c.bg,tx:c.tx};})};}

 let wErr="";

 const r=await fetch(SUPA_URL+"/rest/v1/agenda_sync?on_conflict=code",{method:"POST",headers:Object.assign({},SUPA_HDR,{Prefer:"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify(body)});

/* --- etiquetas de tipo --- */
function tagById(id){return id?(tags.find(t=>t.id===id)||null):null;}
function tagPal(t){return (t&&TGPAL.find(p=>p.k===t.c))||TGGRIS;}
function tagDe(taskId){return tagById(tagOv[taskId]);}
function tagIni(t){return (t.i||(t.n||'?').trim().charAt(0)||'?').toUpperCase();}
/* el ancho de la columna se saca del nombre más largo del catálogo */
function tgWidth(){let m=2;tags.forEach(t=>{m=Math.max(m,(t.n||'').length);});
 const w=Math.min(74,Math.max(32,Math.round(m*5.6+16)));
 document.documentElement.style.setProperty('--tgw',w+'px');}
/* columna de ancho fijo, para la rejilla de bloques. Sin etiqueta = pastilla gris con guion. */
function tgCol(taskId){const t=tagDe(taskId);const c=t?tagPal(t):TGGRIS;
 return `<span class="tgc" style="background:${c.bg};color:${c.tx}" title="${t?esc(t.n):'sin etiqueta'}">${t?esc(t.n):'—'}</span>`;}
/* solo la inicial, para la matriz */
function tgIniHTML(taskId){const t=tagDe(taskId);if(!t)return"";const c=tagPal(t);
 return `<span class="tgi" style="background:${c.bg};color:${c.tx}" title="${esc(t.n)}">${esc(tagIni(t))}</span>`;}
/* pastilla normal, para la lista corta. Si no tiene etiqueta no pinta nada. */
function tgPill(taskId){const t=tagDe(taskId);if(!t)return"";const c=tagPal(t);
 return `<span class="tipo" style="background:${c.bg};color:${c.tx}">${esc(t.n)}</span>`;}
/* lo que viaja al widget: nombre visible + los dos colores, nunca solo el id */
function tgBlob(taskId){const t=tagDe(taskId);if(!t)return null;const c=tagPal(t);
 return {id:t.id,n:t.n,i:tagIni(t),bg:c.bg,tx:c.tx};}

function areas(){return [INBOX].concat(SEED,customAreas).filter(a=>!deletedAreas[a.key]);}
function areaByKey(k){return [INBOX].concat(SEED,customAreas).find(a=>a.key===k);}
function colOf(a){ // acepta el formato viejo (bg/fg/sgfg) y el nuevo (sol/bg/tx)
 if(!a)return{sol:"#8A7263",bg:"#EDE5DF",tx:"#5A4437"};
 if(a.sol)return{sol:a.sol,bg:a.bg,tx:a.tx};
 return {sol:a.sgfg||a.fg||"#8A7263",bg:a.bg||"#EDE5DF",tx:a.fg||"#5A4437"};}
function sgNames(area){const del=deletedSg[area.key]||{};return area.groups.map(g=>g.sg).concat(customSg[area.key]||[]).filter(s=>!del[s]);}
function allTasks(){
 const out=[];
 areas().forEach(area=>area.groups.forEach((grp,gi)=>grp.items.forEach((it,ii)=>{
   out.push({id:area.key+"|"+gi+"|"+ii,area:area.key,baseSg:grp.sg,t:it.t,hoy:it.hoy,tiimoDef:!!it.tiimo,meta:it.meta||"",date:it.date||"",time:it.time||"",rep:it.rep||""});
 })));
 custom.forEach(c=>out.push({id:c.id,area:c.area,baseSg:c.sg,t:c.t,hoy:0,tiimoDef:false,meta:"",date:"",time:"",rep:""}));
 return out;
}
let TKCACHE=null;
function TK(){if(!TKCACHE)TKCACHE=allTasks();return TKCACHE;}
function tkById(id){return TK().find(t=>t.id===id);}
function areaOf(tk){return areaOv[tk.id]||tk.area;}
function areaObjOf(tk){return areaByKey(areaOf(tk));}
function sgOf(tk){return sgOv[tk.id]||tk.baseSg;}
function txtOf(tk){return textOv[tk.id]||tk.t;}
function dateOf(tk){return dateOv[tk.id]||tk.date;}
function repOf(tk){return repeatOv[tk.id]||tk.rep||"";}
function timeOf(tk){return (tk.id in timeOv)?timeOv[tk.id]:(tk.time||"");}
function dtypeOf(tk){return dtypeOv[tk.id]||'do';}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(s,n){const p=(s||todayStr()).split('-').map(Number);const d=new Date(p[0],p[1]-1,p[2]);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addMonths(s,n){const p=(s||todayStr()).split('-').map(Number);const d=new Date(p[0],p[1]-1,p[2]);d.setMonth(d.getMonth()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayDiff(s){const t=new Date();t.setHours(0,0,0,0);const p=s.split('-').map(Number);return Math.round((new Date(p[0],p[1]-1,p[2])-t)/86400000);}
function dLabel(s){const n=dayDiff(s);const p=s.split('-').map(Number);const dt=new Date(p[0],p[1]-1,p[2]);
 if(n===0)return'hoy';if(n===1)return'mañana';if(n===-1)return'ayer';
 if(n<-1)return'venció';
 if(n>1&&n<7)return dt.toLocaleDateString('es-MX',{weekday:'short'}).replace('.','')+' '+p[2];
 return dt.toLocaleDateString('es-MX',{day:'numeric',month:'short'}).replace('.','');}
/* colores del renglón según qué tan cerca está */
function tonoFecha(n){
 if(n<0) return {cls:'venc', bg:'#F6D9D0', tx:'var(--dantx)', lab:'venció'};
 if(n===0)return {cls:'hoy',  bg:'#EFCFBE', tx:'var(--acctx)', lab:'hoy'};
 if(n===1)return {cls:'man',  bg:'#E6D6B4', tx:'var(--ambtx)', lab:'mañana'};
 if(n<=7) return {cls:'',     bg:'var(--blubg)', tx:'var(--blutx)', lab:''};
 return       {cls:'',     bg:'var(--soft)',  tx:'var(--mut)',   lab:''};}
/* ---------- recurrencia ---------- */
const REPS=[['','No se repite'],['daily','Cada día'],['weekly','Cada semana'],
            ['biweekly','Cada 2 semanas'],['monthly','Cada mes'],['bimonthly','Cada 2 meses']];
function repLabel(rp){return {daily:'cada día',weekly:'cada semana',biweekly:'cada 2 semanas',
 monthly:'cada mes',bimonthly:'cada 2 meses'}[rp]||'';}
function repNext(rp,base){
 if(rp==='monthly')return addMonths(base,1);
 if(rp==='bimonthly')return addMonths(base,2);
 if(rp==='weekly')return addDays(base,7);
 if(rp==='biweekly')return addDays(base,14);
 return addDays(base,1);}
function overdue(tk){const d=dateOf(tk);return !!(d&&dayDiff(d)<0&&!state[tk.id]);}
function activo(tk){return !archived[tk.id]&&!state[tk.id];}
function doneToday(){const t=todayStr();return Object.values(doneLog).filter(d=>d===t).length;}

/* =======================================================================
   MIGRACIÓN — corre una sola vez. Nada se borra.
   ======================================================================= */
function migrar(){
 if(localStorage.getItem(MGKEY)==="1")return;
 const yaEsta=id=>short.some(e=>!e.free&&e.id===id);
 const nueva=[];
 // 1) los recordatorios: ya eran tu lista corta
 rmind.forEach(r=>{if(r&&r.t)nueva.push({free:true,id:"x"+Math.random().toString(36).slice(2,9),t:r.t,done:!!r.done});});
 // 2) los importantes, en el orden que tú les diste
 const tks=allTasks();const vivo=id=>tks.some(t=>t.id===id)&&!archived[id];
 impOrder.forEach(id=>{if(impSt[id]&&vivo(id)&&!yaEsta(id)&&!nueva.some(e=>e.id===id))nueva.push({id:id});});
 Object.keys(impSt).forEach(id=>{if(impSt[id]&&vivo(id)&&!nueva.some(e=>e.id===id))nueva.push({id:id});});
 // 3) lo que TÚ marcaste para hoy (no los "hoy" que traía la plantilla original,
 //    que son de hace meses y llenarían la lista de golpe)
 Object.keys(hoyOv).forEach(id=>{if(hoyOv[id]&&vivo(id)&&!state[id]&&!nueva.some(e=>e.id===id))nueva.push({id:id});});
 // 4) lo que estaba en la Bandeja, para que no se quede en un lugar que ya no visitas
 tks.forEach(tk=>{if(areaOf(tk)==='inbox'&&!archived[tk.id]&&!state[tk.id]&&!nueva.some(e=>e.id===tk.id))nueva.push({id:tk.id});});
 short=nueva;
 localStorage.setItem(MGKEY,"1");
 save();
}

function editorRapido(e,i){
 const f=datosFila(e);if(!f)return"";
 const areaK=f.area?f.area.key:'';
 let opts=`<option value="">— sin bloque —</option>`;
 areas().forEach(a=>{opts+=`<option value="${a.key}" ${a.key===areaK?'selected':''}>${esc(a.name)}</option>`;});
 let sgOpts="";
 if(f.area){const cur=sgOf(f.tk);sgNames(f.area).forEach(s=>{sgOpts+=`<option value="${esc(s)}" ${s===cur?'selected':''}>${esc(labelOv[areaK+'|'+s]||s)}</option>`;});}
 const chips=DUR.map((d,k)=>`<button class="dchip ${f.dur===k?'on':''}" style="${f.dur===k?`background:${d.c};border-color:${d.c};color:#fff`:''}" onclick="qeDur(${i},${k})">${d.t}</button>`).join('')
   +`<button class="dchip ${f.dur<0?'on':''}" onclick="qeDur(${i},-1)">sin estimar</button>`;
 let h=`<div class="qe">`;
 if(!e.free){
   h+=`<div class="qerow"><label>Fecha</label><input type="date" value="${dateOf(f.tk)||''}" onchange="qeFecha(${i},this.value)"></div>`;
 }
 h+=`<div class="qerow"><label>Hora</label><input value="${esc(horaDe(e))}" placeholder="8 pm" onchange="setHora(${i},this.value)"></div>`;
 if(!e.free)h+=`<div class="qerow"><label>Cuánto me toma</label><div class="dchips">${chips}</div></div>`;
 h+=`<div class="qerow"><label>Bloque${f.area?' y sección':''}</label><div class="frow">`+
    `<select onchange="qeArea(${i},this.value)">${opts}</select>`+
    (f.area?`<select onchange="qeSg(${i},this.value)">${sgOpts}</select>`:'')+`</div></div>`;
 if(!e.free)h+=`<div class="qerow"><label></label><button class="mini" onclick="openDetail(null,'${e.id}')">Abrir la tarea completa</button></div>`;
 return h+`</div>`;}
function datosFila(e){
 if(e.free)return {texto:e.t,hecho:!!e.done,area:null,col:null,n:null,hora:'',dur:-1};
 const tk=tkById(e.id);if(!tk)return null;
 const a=areaObjOf(tk);const d=dateOf(tk);
 return {texto:txtOf(tk),hecho:!!state[tk.id],area:a,col:colOf(a),
         n:d?dayDiff(d):null,hora:timeOf(tk),dur:durOf(tk.id),tk:tk};}
function pastillaCuando(n){
 if(n===null||n>3)return"";
 const bg=n<=1?'var(--danbg)':n===2?'var(--accbg)':'var(--ambbg)';
 const tx=n<=1?'var(--dantx)':n===2?'var(--acctx)':'var(--ambtx)';
 return `<span class="tipo" style="background:${bg};color:${tx}">${n<0?'venció':n===0?'hoy':n===1?'mañana':n+' días'}</span>`;}
/* Todas las filas se arrastran. opts: num, reordena, pastillaArea, estrella, auto, hora */
function filaCorta(e,i,opts){
 const f=datosFila(e);if(!f)return"";
 const gris=(opts.gris&&i>=TOPE)?'faded':'';
 const reord=opts.reordena?` ondragover="sDragOver(event)" ondragleave="sDragLeave(event)" ondrop="sDrop(event)"`:
             (opts.soltarHora?` ondragover="sDragOver(event)" ondragleave="sDragLeave(event)" ondrop="hrDrop(event,${i})"`:'');
 let h=`<div class="lcrow ${gris} ${f.hecho?'done':''}" draggable="true" data-i="${i}" ondragstart="sDragStart(event)" ondragend="sDragEnd(event)"${reord}>`;
 h+=`<span class="grip">⠿</span>`;
 if(opts.num)h+=`<span class="rnum">${i+1}</span>`;
 if(opts.estrella)h+=`<button class="star ${e.imp?'on':''}" title="Marcar como importante" onclick="cortaImp(${i})">${e.imp?'★':'☆'}</button>`;
 h+=`<span class="rc ${f.hecho?'on':''}" onclick="cortaToggle(${i})">${f.hecho?'✓':''}</span>`+
    ((opts.pastillaArea&&f.col)?`<span class="rdot" style="background:${f.col.sol}" title="${esc(f.area.name)}"></span>`:'')+
    (e.free?'':(opts.tgIni?tgIniHTML(e.id):tgPill(e.id)))+
    `<span class="rt" onclick="cortaEdit(${i})">${esc(f.texto)}</span>`;
 if(opts.hora!==false){
   const hv=horaDe(e);
   if(qeHora===i)h+=`<input class="hin" id="horaIn" value="${esc(hv)}" placeholder="8 pm" onkeydown="horaKey(event,${i})" onblur="horaBlur(event,${i})">`;
   else h+=`<button class="hchip ${hv?'':'vacia'}" title="Poner o cambiar la hora aquí mismo" onclick="horaEdit(${i})">${hv?esc(hv):'＋ hora'}</button>`;
 }
 h+=pastillaCuando(f.n);
 if(opts.auto&&e.q!=null)h+=`<button class="mini" title="Volver a acomodarla sola por su fecha" onclick="quadAuto(${i})">auto</button>`;
 h+=`<button class="qeb ${qeOpen===e.id?'on':''}" title="Cambiar fecha, hora, duración o bloque aquí mismo" onclick="toggleQE('${e.id}')">⋯</button>`;
 h+=`<span class="rx" title="Bajar de la lista" onclick="cortaDel(${i})">✕</span></div>`;
 if(qeOpen===e.id)h+=editorRapido(e,i);
 return h;}

function vistaLibre(){
 let r="";short.forEach((e,i)=>{r+=filaCorta(e,i,{num:1,reordena:1,pastillaArea:1,gris:1,hora:false});});

function vistaBloque(){
 const grupos=new Map();
 areas().forEach(a=>grupos.set(a.key,{area:a,col:colOf(a),items:[]}));
 grupos.set('__libres',{area:null,col:null,items:[]});
 short.forEach((e,i)=>{const f=datosFila(e);if(!f)return;
   const k=f.area?f.area.key:'__libres';
   if(!grupos.has(k))grupos.set(k,{area:f.area,col:f.col,items:[]});
   grupos.get(k).items.push({e,i});});
 let r="";
 grupos.forEach((g,k)=>{
   if(!g.items.length&&k!=='__libres')return;        // solo bloques con algo
   if(!g.items.length&&k==='__libres')return;
   const c=g.col||{sol:'var(--hint)',bg:'var(--soft)',tx:'var(--mut)'};
   r+=`<div class="grpH" style="color:${c.tx};border-bottom-color:${c.sol}" ondragover="sDragOver(event)" ondragleave="sDragLeave(event)" ondrop="grpDrop(event,'${k}')">`+
      `<span class="gdot" style="background:${c.sol}"></span>${esc(g.area?g.area.name:'Pendientes sueltos')}`+
      `<span class="gn">${g.items.length}</span></div>`;
   g.items.forEach(({e,i})=>{r+=filaCorta(e,i,{reordena:1,hora:false});});});
 return r+`<div class="lcempty" style="margin-top:8px">Arrastra una tarea al título de otro bloque para moverla ahí.</div>`;}
function vistaMatriz(){
 const Q=[
  {t:'Hazlo ya',        d:'urgente e importante',  bg:'var(--danbg)', tx:'var(--dantx)', items:[]},
  {t:'Agéndalo',        d:'importante, sin prisa', bg:'var(--grnbg)', tx:'var(--grntx)', items:[]},
  {t:'Sácatelo rápido', d:'urgente, no importante',bg:'var(--ambbg)', tx:'var(--ambtx)', items:[]},

 short.forEach((e,i)=>{Q[quadDe(e)].items.push({e,i});});

function minutos(h){const m=String(h||'').match(/(\d+)(?::(\d+))?\s*(a\.?m\.?|p\.?m\.?)?/i);
 if(!m)return null;let hh=+m[1],mm=m[2]?+m[2]:0;const ap=(m[3]||'').toLowerCase().replace(/\./g,'');
 if(ap==='pm'&&hh<12)hh+=12;if(ap==='am'&&hh===12)hh=0;return hh*60+mm;}
function vistaHoras(){
 const con=[],sin=[];
 short.forEach((e,i)=>{const f=datosFila(e);if(!f)return;
   const mi=minutos(horaDe(e));(mi===null?sin:con).push({e,i,mi});});
 con.sort((a,b)=>a.mi-b.mi);
 let r="";
 con.forEach(({e,i,mi})=>{
   const hh=String(Math.floor(mi/60)).padStart(2,'0'),mm=String(mi%60).padStart(2,'0');
   r+=`<div class="hrrow"><span class="hrt">${hh}:${mm}</span>`+
      `<div class="hrb">${filaCorta(e,i,{pastillaArea:1,soltarHora:1})}</div></div>`;});
 r+=`<div class="grpH sinhora" style="color:var(--mut);border-bottom-color:var(--line2)" ondragover="sDragOver(event)" ondragleave="sDragLeave(event)" ondrop="sinHoraDrop(event)">`+
    `<span class="gdot" style="background:var(--line2)"></span>Sin hora<span class="gn">${sin.length}</span></div>`;
 sin.forEach(({e,i})=>{r+=filaCorta(e,i,{pastillaArea:1,reordena:1});});
 r+=`<div class="lcempty" style="margin-top:8px">Toca la hora de cualquier renglón para escribirla. Arrastra una tarea sobre otra para darle su misma hora, o al título "Sin hora" para quitársela.</div>`;
 return r;}

function renderShort(){
 const box=document.getElementById('shortBox');
 const tks=TK();
 short=short.filter(e=>e.free||tks.some(t=>t.id===e.id));   // limpia referencias muertas
 let rows;
 if(shortView==='bloque')rows=vistaBloque();
 else if(shortView==='matriz')rows=vistaMatriz();
 else if(shortView==='horas')rows=vistaHoras();
 else rows=vistaLibre();
 const aviso=(shortView==='libre'&&short.length>TOPE)?`<div class="full">Del ${TOPE+1} para abajo ya no lo estás viendo de verdad.<button class="mini" style="margin-left:auto" onclick="cortaVaciarGrises()">Mandarlos a sus áreas</button></div>`:"";

function parseDT(tk){const d=dateOf(tk);const tt=timeOf(tk);if(!d)return null;const p=d.split('-').map(Number);
 if(!tt)return null;
 const m=String(tt).match(/(\d+)(?::(\d+))?\s*(a\.?m\.?|p\.?m\.?)?/i);if(!m)return null;
 let h=+m[1],mi=m[2]?+m[2]:0;const ap=(m[3]||'').toLowerCase().replace(/\./g,'');
 if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;
 return new Date(p[0],p[1]-1,p[2],h,mi);}

function renderCd(){
 const box=document.getElementById('cdBox');const now=new Date();
 let best=null,bt=null;
 TK().forEach(tk=>{if(!activo(tk))return;const dt=parseDT(tk);if(dt&&dt>now&&(!bt||dt<bt)){bt=dt;best=tk;}});
 if(!best){box.innerHTML="";return;}
 const diff=bt-now,hrs=diff/3600000;
 const dd=dayDiff(dateOf(best));               // días de calendario, no horas sueltas
 const h=Math.floor(diff/3600000),mn=Math.floor((diff%3600000)/60000);
 const cuando=dd>1?('el '+dLabel(dateOf(best))+' a las '+timeOf(best))
   :dd===1?('mañana a las '+timeOf(best))
   :(h>0?('en '+h+' h'+(mn?' '+mn+' min':'')):('en '+mn+' min'));
 const cls=(dd===0&&hrs<6)?'dan':(dd===0?'amb':'blu');
 box.innerHTML=`<div class="alert ${cls}" onclick="openDetail(null,'${best.id}')" style="cursor:pointer">${esc(txtOf(best))} · ${cuando}</div>`;
}

 let chips="";let hay=false;
 for(let i=0;i<8;i++){
   const d=addDays(todayStr(),i);const lista=(porDia[d]||[]).sort((a,b)=>parseDT(a)-parseDT(b));
   if(lista.length)hay=true;
   const p=d.split('-').map(Number),dt=new Date(p[0],p[1]-1,p[2]);
   const nom=i===0?'Hoy '+dt.toLocaleDateString('es-MX',{weekday:'short'}):dt.toLocaleDateString('es-MX',{weekday:'short',day:'numeric'});
   let cuerpo;
   if(!lista.length)cuerpo=`<div class="cdh" style="color:var(--hint);font-weight:400">—</div>`;

   }
   chips+=`<div class="cd ${i===0?'hoy':''}"><div class="cdd">${esc(nom)}</div>${cuerpo}</div>`;
 }
 // días con hora más allá de una semana
 Object.keys(porDia).sort().forEach(d=>{const n=dayDiff(d);if(n<8)return;
   const lista=porDia[d].sort((a,b)=>parseDT(a)-parseDT(b));
   const p=d.split('-').map(Number),dt=new Date(p[0],p[1]-1,p[2]);
   chips+=`<div class="cd"><div class="cdd">${dt.toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'})}</div><div class="cdh">${esc(timeOf(lista[0]))}</div><div class="cdt">${esc(txtOf(lista[0]))}</div></div>`;hay=true;});

function toggle(id){const tk=tkById(id);if(!tk)return;const enciende=!state[id];

   doneLog[id]=todayStr();celebrate();}else{delete doneLog[id];}

function addKey(e,area,sgEnc){if(e.key!=="Enter")return;const v=e.target.value.trim();if(!v)return;
 const sg=decodeURIComponent(sgEnc);const id=area+"|c|"+Date.now();

 e.target.value='';save();render();}
function newSgInput(el,area){el.outerHTML=`<input class="addsm" placeholder="Nombre de la sección…" onkeydown="newSgKey(event,'${area}')">`;
 const i=document.querySelector('.addsm[placeholder^="Nombre de la sec"]');if(i)i.focus();}
function newSgKey(e,area){if(e.key!=='Enter')return;const v=e.target.value.trim();if(!v){render();return;}
 if(!customSg[area])customSg[area]=[];customSg[area].push(v);save();render();}
function delSg(ev,areaKey,sgEnc){ev.stopPropagation();const sg=decodeURIComponent(sgEnc);const area=areaByKey(areaKey);
 const quedan=sgNames(area).filter(s=>s!==sg);
 if(!quedan.length){toast('No puedes borrar la única sección del bloque.');return;}
 if(!confirm('¿Borrar la sección? Sus tareas se mueven a "'+quedan[0]+'".'))return;
 const dest=quedan[0];
 TK().forEach(t=>{if(areaOf(t)===areaKey&&sgOf(t)===sg){if(t.id.includes('|c|')){const c=custom.find(x=>x.id===t.id);if(c)c.sg=dest;}else sgOv[t.id]=dest;}});
 if((customSg[areaKey]||[]).includes(sg))customSg[areaKey]=customSg[areaKey].filter(x=>x!==sg);
 else{if(!deletedSg[areaKey])deletedSg[areaKey]={};deletedSg[areaKey][sg]=true;}
 delete labelOv[areaKey+'|'+sg];save();render();}

 const key="u"+Date.now();const p=PALETTE[customAreas.length%PALETTE.length];
 customAreas.push({key,name:v,icon:"",sol:p[0],bg:p[1],tx:p[2],custom:true,groups:[{sg:"General",items:[]}]});

let tDrag=null;
function tDragStart(e){tDrag=e.currentTarget.dataset.id;e.currentTarget.classList.add('dragging');e.stopPropagation();}
function tDragEnd(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.over,.drop').forEach(x=>x.classList.remove('over','drop'));tDrag=null;}
function tDragOver(e){e.preventDefault();e.stopPropagation();if(e.currentTarget.dataset.id!==tDrag)e.currentTarget.classList.add('over');}
function tDragLeave(e){e.currentTarget.classList.remove('over');}
function tDrop(e){e.preventDefault();e.stopPropagation();const target=e.currentTarget.dataset.id;if(!tDrag||tDrag===target)return;
 const tk=tkById(tDrag),tt=tkById(target);if(!tk||!tt)return;if(areaOf(tk)!==areaOf(tt))return;
 sgOv[tDrag]=sgOf(tt);
 let ord=areaOrder[areaOf(tk)]||TK().filter(t=>areaOf(t)===areaOf(tk)).map(t=>t.id);
 ord=ord.filter(x=>x!==tDrag);let ti=ord.indexOf(target);if(ti<0)ti=ord.length;ord.splice(ti,0,tDrag);
 areaOrder[areaOf(tk)]=ord;save();render();}
function sgDragOver(e){e.preventDefault();e.currentTarget.classList.add('drop');}
function sgDragLeave(e){e.currentTarget.classList.remove('drop');}
function sgDrop(e){e.preventDefault();e.currentTarget.classList.remove('drop');
 const area=e.currentTarget.dataset.area,sg=decodeURIComponent(e.currentTarget.dataset.sg);
 const tk=tkById(tDrag);if(!tk)return;
 if(tk.id.includes('|c|')){const c=custom.find(x=>x.id===tDrag);if(c){c.area=area;c.sg=sg;}delete sgOv[tDrag];delete areaOv[tDrag];}
 else{if(tk.area!==area)return;sgOv[tDrag]=sg;}
 let ord=(areaOrder[area]||TK().filter(t=>areaOf(t)===area).map(t=>t.id)).filter(x=>x!==tDrag);ord.push(tDrag);
 areaOrder[area]=ord;save();render();}
function archOver(e){e.preventDefault();e.currentTarget.classList.add('drop');}
function archLeave(e){e.currentTarget.classList.remove('drop');}
function archDrop(e){e.preventDefault();e.currentTarget.classList.remove('drop');if(!tDrag)return;archived[tDrag]=true;short=short.filter(x=>x.free||x.id!==tDrag);save();render();}

 if(borrador.dd!==undefined){if(borrador.dd)dateOv[id]=borrador.dd;else delete dateOv[id];}
 if(borrador.h!==undefined){const v=borrador.h.trim();if(v)timeOv[id]=v;else delete timeOv[id];}
 if(borrador.r!==undefined){if(borrador.r)repeatOv[id]=borrador.r;else delete repeatOv[id];}

 if(borrador.a!==undefined){const ak=borrador.a,sgv=borrador.s;
   if(id.includes('|c|')){const c=custom.find(x=>x.id===id);if(c){c.area=ak;if(sgv)c.sg=sgv;}delete areaOv[id];delete sgOv[id];}
   else{if(ak!==tk.area)areaOv[id]=ak;else delete areaOv[id];if(sgv)sgOv[id]=sgv;}}

  (decoOpen?decoHTML():`<div style="font-size:11.5px;color:var(--mut);line-height:1.5">La leyenda de las franjas, los fondos y las pastillas. Ábrela cuando dudes de un color.</div>`)+`</div>`+

  `<div class="pnl"><div class="pnlh" style="cursor:default"><span class="ph" style="background:var(--grnbg);color:var(--grntx)">Cerrar el día</span></div>`+
  `<div style="font-size:11.5px;color:var(--mut);line-height:1.5;margin-bottom:8px">Cerraste <b style="color:var(--txt)">${dc} ${dc===1?'cosa':'cosas'}</b> hoy. Lo que quedó pendiente con fecha de hoy se pasa a mañana.</div>`+
  `<button class="add" style="text-align:center" onclick="closeDay()">Cerrar el día</button></div>`+

  `<div class="pnl"><div class="pnlh" style="cursor:default"><span class="ph" style="background:var(--blubg);color:var(--blutx)">Respaldo</span></div>`+
  `<div style="font-size:11.5px;color:var(--mut);line-height:1.5;margin-bottom:8px">Pon el mismo código secreto en la compu y en el celular y se sincronizan solos.</div>`+
  `<div class="frow" style="margin-bottom:6px"><input id="syncCodeInput" placeholder="tu código secreto" value="${esc(syncCode)}" style="font-size:13px;border:1px solid var(--line2);border-radius:9px;padding:7px 10px;outline:none;width:100%"><button class="mini" onclick="connectSync()">Conectar</button></div>`+
  `<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="mini" onclick="syncNow()">Sincronizar ahora</button><button class="mini" onclick="forcePush()">Subir a la nube</button><button class="mini" onclick="forcePull()">Traer de la nube</button></div>`+
  `<div class="msg" id="syncStatus">${syncCode?'Conectado como "'+esc(syncCode)+'"':''}</div>`+
  `<div style="border-top:1px dashed var(--line2);margin-top:10px;padding-top:9px">`+
  `<div style="font-size:11.5px;color:var(--mut);line-height:1.5;margin-bottom:7px">Respaldo por código: genera uno y guárdalo en tus notas. Sirve para pasar todo a otro dispositivo.</div>`+
  `<textarea id="ioBox" placeholder="Aquí aparece o pegas el código…" style="width:100%;height:52px;font-size:11px;border:1px solid var(--line2);border-radius:9px;padding:7px;resize:vertical;outline:none"></textarea>`+
  `<div style="display:flex;gap:6px;margin-top:6px"><button class="mini" onclick="exportData()">Generar y copiar</button><button class="mini" onclick="importData()">Importar</button></div>`+
  `<div class="msg" id="ioMsg"></div></div></div>`+

  tgPanel()+

  (ocultos.length?`<div class="pnl"><div class="pnlh" style="cursor:default"><span class="ph" style="background:var(--ambbg);color:var(--ambtx)">Bloques ocultos</span><span class="n">${ocultos.length}</span></div>`+
   `<div style="display:flex;gap:5px;flex-wrap:wrap">${ocultos.map(k=>{const a=areaByKey(k);const nom=a?a.name:(k==='date'?'Con fecha':k==='rec'?'Recurrentes':k==='deleg'?'Delegadas':k);
     return `<button class="mini" onclick="showBlock('${k}');pintaMenu()">${esc(nom)} ↩</button>`;}).join('')}</div></div>`:'');
}
let tgOpen=null;
function tgCount(id){return Object.keys(tagOv).filter(k=>tagOv[k]===id).length;}
function tgToggleOpen(id){tgOpen=(tgOpen===id)?null:id;pintaMenu();}
function tgMove(id,d){const i=tags.findIndex(t=>t.id===id),j=i+d;
 if(i<0||j<0||j>=tags.length)return;const m=tags.splice(i,1)[0];tags.splice(j,0,m);save();render();pintaMenu();}
function tgRename(id,v){const t=tagById(id);if(!t)return;const nv=(v||'').trim();if(!nv)return;
 t.n=nv;if(!t.i)t.i=tagIni(t);save();render();pintaMenu();}
function tgSetIni(id,v){const t=tagById(id);if(!t)return;
 t.i=((v||'').trim().slice(0,2)||(t.n||'?').charAt(0)).toUpperCase();save();render();pintaMenu();}
function tgColor(id,k){const t=tagById(id);if(!t)return;t.c=k;save();render();pintaMenu();}
function tgAdd(e){if(e.key!=='Enter')return;const v=e.target.value.trim();if(!v)return;
 if(tags.some(t=>t.n.toLowerCase()===v.toLowerCase())){alert('Ya tienes una etiqueta que se llama así.');return;}
 const usados=tags.map(t=>t.c);
 const libre=TGPAL.slice(0,7).find(p=>usados.indexOf(p.k)<0)||TGPAL[tags.length%7];
 const id='tg'+Date.now().toString(36);
 tags.push({id:id,n:v,i:v.charAt(0).toUpperCase(),c:libre.k});
 e.target.value='';tgOpen=id;save();render();pintaMenu();}
function tgDel(id){const t=tagById(id);if(!t)return;const c=tgCount(id);
 const msg=c?(c+' '+(c===1?'tarea la trae':'tareas la traen')+'. Si la borras, esas tareas quedan sin etiqueta. ¿Seguir?')
            :('¿Borrar la etiqueta "'+t.n+'"?');
 if(!confirm(msg))return;
 tags=tags.filter(x=>x.id!==id);if(tgOpen===id)tgOpen=null;save();render();pintaMenu();}
function tgPanel(){
 let h=`<div class="pnl"><div class="pnlh" style="cursor:default"><span class="ph" style="background:var(--purbg);color:var(--purtx)">Etiquetas</span><span class="n">${tags.length}</span></div>`+
  `<div style="font-size:11.5px;color:var(--mut);line-height:1.5;margin-bottom:8px">Qué clase de cosa es la tarea. El orden de aquí es el orden en que aparecen al editarla. Toca una para cambiarle nombre, inicial o color.</div>`;
 tags.forEach((t,ix)=>{
  const c=tagPal(t),cn=tgCount(t.id),ab=tgOpen===t.id;
  h+=`<div class="tgrow" onclick="tgToggleOpen('${t.id}')">`+
     `<span class="tgsw" style="background:${c.bg}"></span>`+
     `<span class="tgnm">${esc(t.n)}</span>`+
     `<span class="tgn">${cn}</span>`+
     `<button class="tgar" ${ix===0?'disabled':''} title="Subir" onclick="event.stopPropagation();tgMove('${t.id}',-1)">▲</button>`+
     `<button class="tgar" ${ix===tags.length-1?'disabled':''} title="Bajar" onclick="event.stopPropagation();tgMove('${t.id}',1)">▼</button>`+
     `<span class="tgn">${ab?'▾':'▸'}</span></div>`;
  if(!ab)return;
  h+=`<div class="tgexp" onclick="event.stopPropagation()">`+
     `<label class="tgfl">Nombre</label><input class="tgin" value="${esc(t.n)}" onchange="tgRename('${t.id}',this.value)">`+
     `<div style="display:flex;gap:9px;margin-top:11px">`+
       `<div style="width:72px;flex:none"><label class="tgfl">Inicial</label>`+
       `<input class="tgin" maxlength="2" style="text-align:center" value="${esc(tagIni(t))}" onchange="tgSetIni('${t.id}',this.value)"></div>`+
       `<div style="flex:1;min-width:0"><label class="tgfl">Se ve así</label>`+
       `<div style="padding-top:4px;display:flex;gap:6px;align-items:center">`+
       `<span class="tipo" style="background:${c.bg};color:${c.tx}">${esc(t.n)}</span>`+
       `<span class="tgi" style="display:inline-block;background:${c.bg};color:${c.tx}">${esc(tagIni(t))}</span></div></div>`+
     `</div>`+
     `<label class="tgfl" style="margin-top:12px">Color</label><div class="tgstrip">`+
     TGPAL.map((p,pi)=>pi===7
       ? `<button class="tgchip off" style="background:${p.bg}" title="El gris está apartado para las tareas sin etiqueta"></button>`
       : `<button class="tgchip ${t.c===p.k?'on':''}" style="background:${p.bg}" title="${p.n}" onclick="tgColor('${t.id}','${p.k}')"></button>`).join('')+
     `</div>`+
     `<div style="display:flex;align-items:center;gap:9px;margin-top:13px">`+
     `<span style="flex:1;font-size:10.5px;color:var(--mut);line-height:1.5">${cn?(cn+' '+(cn===1?'tarea la trae':'tareas la traen')+'. Si la borras, quedan sin etiqueta.'):'Todavía no la usa ninguna tarea.'}</span>`+
     `<button class="mini" onclick="tgDel('${t.id}')">Borrar</button></div></div>`;});
 return h+`<input class="add" placeholder="＋ nueva etiqueta y Enter" onkeydown="tgAdd(event)" style="margin-top:3px">`+`</div>`;}

function decoHTML(){
 const escala=DUR.map(d=>`<i style="height:${d.h}px;background:${d.c}"></i>`).join('');
 return `<div class="decrow"><div class="decs"><span class="scaleN">${escala}</span></div>`+
  `<div class="dect"><b>La franja de la izquierda</b><span>Cuánto te va a tomar, de 5 minutos a varios días. Entre más alta, más larga. <em>No dice</em> qué tan urgente es.</span></div></div>`+
 `<div class="decrow"><div class="decs"><div style="width:58px">`+
  `<div style="height:11px;background:#F3EDDF;border-radius:0 4px 4px 0;border-left:2px solid #A98545;margin-bottom:2px"></div>`+
  `<div style="height:11px;background:#F7E7DE;border-radius:0 4px 4px 0;border-left:2px solid #C97B5A;margin-bottom:2px"></div>`+
  `<div style="height:11px;background:#F8E3DE;border-radius:0 4px 4px 0;border-left:2px solid #B5503F"></div></div></div>`+
  `<div class="dect"><b>El fondo de color del renglón</b><span>Faltan 3, 2 o 1 día. Solo eso lo pinta. Si está blanco, falta más o no tiene fecha. <em>No dice</em> de qué área es.</span></div></div>`+
 `<div class="decrow"><div class="decs"><span style="width:5px;height:28px;background:#C97B5A;border-radius:3px;display:inline-block"></span></div>`+
  `<div class="dect"><b>La franja gruesa del borde</b><span>De qué área es la tarea, en el modo Ahora. El nombre va escrito al lado en el mismo color.</span></div></div>`+
 `<div class="decrow"><div class="decs"><span style="width:9px;height:9px;border-radius:50%;background:#5F8A7D;display:inline-block"></span></div>`+
  `<div class="dect"><b>El punto del encabezado</b><span>El color del área. Cada bloque tiene el suyo y no cambia nunca.</span></div></div>`+
 `<div class="decrow"><div class="decs"><span class="tipo" style="background:var(--danbg);color:var(--dantx)">1 vencida</span></div>`+
  `<div class="dect"><b>Las pastillas del encabezado de un área</b><span>Lo que se te viene encima ahí dentro, sin abrirla. Un área sin pastillas puede esperar.</span></div></div>`+
 `<div class="decrow"><div class="decs"><span class="tipo" style="background:var(--grnbg);color:var(--grntx)">cada semana</span></div>`+
  `<div class="dect"><b>Las pastillas del subtítulo</b><span>Lo que no todas las tareas tienen: que se repite, que la delegaste, cuántos pasos llevas.</span></div></div>`+
 `<div class="decrow"><div class="decs"><button class="up on">↑</button></div>`+
  `<div class="dect"><b>La flecha del renglón</b><span>Sube la tarea a "Lo que importa ahorita". Es el <em>único</em> lugar donde algo puede ser importante. Tócala otra vez para bajarla.</span></div></div>`+
 `<div class="decrow"><div class="decs"><span style="font-size:10px;color:var(--hint);text-align:center;line-height:1.3;opacity:.5">del ${TOPE+1}<br>en gris</span></div>`+
  `<div class="dect"><b>Los renglones grises de la lista corta</b><span>Ya son demasiados y dejaste de verlos de verdad. Arrástralos arriba si sí importan, o mándalos a sus áreas.</span></div></div>`+
 `<div class="decrow"><div class="decs"><span class="big" style="color:#5A9E86">30 min</span></div>`+
  `<div class="dect"><b>El número grande del modo Ahora</b><span>Cuánto te toma. Las tareas están agrupadas por eso para que escojas según la energía que traigas.</span></div></div>`;
}
function closeDay(){
 let movidas=0;
 TK().forEach(tk=>{if(state[tk.id]||archived[tk.id])return;const d=dateOf(tk);
   if(d&&dayDiff(d)<=0){dateOv[tk.id]=addDays(todayStr(),1);movidas++;}});
 short=short.filter(e=>e.free?!e.done:!state[e.id]);
 celebrate();save();render();pintaMenu();
 toast('Moví '+movidas+' a mañana y limpié lo cerrado. Descansa.');}
function exportData(){const o={};Object.keys(localStorage).forEach(k=>{if(k.indexOf('agenda_')===0)o[k]=localStorage.getItem(k);});
 const code=btoa(unescape(encodeURIComponent(JSON.stringify(o))));const box=document.getElementById('ioBox');box.value=code;box.select();
 try{navigator.clipboard.writeText(code);}catch(e){}
 document.getElementById('ioMsg').textContent='Código generado y copiado. Guárdalo en tus notas.';}
function importData(){const code=document.getElementById('ioBox').value.trim();if(!code){document.getElementById('ioMsg').textContent='Pega primero un código.';return;}
 try{const o=JSON.parse(decodeURIComponent(escape(atob(code))));
   Object.keys(o).forEach(k=>{if(k!=='agenda_synccode'&&k!=='agenda_remote_ts')localStorage.setItem(k,o[k]);});
   document.getElementById('ioMsg').textContent='Importado.';
   if(syncCode){localStorage.removeItem('agenda_remote_ts');dirty=true;doPush().then(()=>{setTimeout(()=>location.reload(),700);});}
   else setTimeout(()=>location.reload(),700);}
 catch(e){document.getElementById('ioMsg').textContent='El código no es válido. Cópialo completo e intenta de nuevo.';}}

function setMode(m){viewMode=m;
 document.getElementById('nowView').style.display=(m==='now')?'':'none';
 document.getElementById('allView').style.display=(m==='all')?'':'none';
 document.getElementById('mNow').classList.toggle('on',m==='now');
 document.getElementById('mAll').classList.toggle('on',m==='all');
 document.body.classList.toggle('modo-now',m==='now');
 localStorage.setItem(VMKEY,m);dirty=true;schedulePush();render();
 window.scrollTo(0,0);}
function renderNow(){if(viewMode!=='now')return;renderCd();renderDays();renderEnergy();renderStreak();}
function renderTodo(){if(viewMode!=='all')return;renderGrid();renderHidden();renderDateBox();renderRec();renderDeleg();renderArch();}
function render(){TKCACHE=null;tgWidth();renderShort();renderFoco();renderNow();renderTodo();}

/* arranque */
document.getElementById('fechaHoy').textContent=new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
migrar();
setMode(viewMode);
setInterval(()=>{if(viewMode==='now')renderCd();},60000);
if(syncCode){syncCycle();setInterval(syncCycle,15000);}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&syncCode)syncCycle();});
window.addEventListener('focus',()=>{if(syncCode)syncCycle();});
