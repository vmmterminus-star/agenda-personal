<style>
:root{
  color-scheme:light;
  --bg:#F7F4EF; --card:#FFFFFF; --soft:#FBF9F5;
  --txt:#33302C; --mut:#7A7267; --hint:#A79E92;
  --line:#E9E3DA; --line2:#D8CFC3;
  --acc:#C97B5A; --accbg:#F4E2D9; --acctx:#8A4529;
  --blu:#4A6272; --blubg:#DFE6EB; --blutx:#2F4553;
  --grn:#5F8A7D; --grnbg:#DFEAE6; --grntx:#3A5E53;
  --amb:#A98545; --ambbg:#F0E8D8; --ambtx:#6E5522;
  --pur:#7A6A8C; --purbg:#EDE7F0; --purtx:#544763;
  --dan:#B5503F; --danbg:#FBE9E4; --dantx:#8C3325;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0 auto;max-width:1400px;background:var(--bg);color:var(--txt);
 font-family:'Josefin Sans',system-ui,-apple-system,sans-serif;font-size:13px;line-height:1.4;
 padding:18px 16px calc(60px + env(safe-area-inset-bottom));overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
h1{font-size:21px;font-weight:600;margin:0 0 1px}

/* ---------- encabezado ---------- */
.apd{font-size:12px;color:var(--mut);margin-bottom:11px}
.tabs{display:flex;align-items:center;gap:3px;margin-bottom:13px;flex-wrap:wrap}
.tab{font-size:12.5px;padding:5px 14px;border-radius:14px;border:1px solid transparent;
 background:transparent;color:var(--mut);cursor:pointer}
.tab:hover{background:var(--soft)}
.tab.on{background:var(--acc);color:#fff}
.mini{font-size:11px;padding:4px 10px;border-radius:12px;border:1px solid var(--line2);
 background:#fff;color:var(--mut);cursor:pointer;white-space:nowrap}
.mini:hover{border-color:var(--acc);color:var(--acctx)}

/* ---------- bloques base ---------- */
.pnl{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 13px;min-width:0;margin-bottom:10px}
.ph{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
 padding:3px 10px;border-radius:11px;display:inline-block}
.pnlh{display:flex;align-items:center;gap:7px;margin-bottom:8px;cursor:pointer;flex-wrap:wrap}
.pnlh .n{font-size:10px;color:var(--hint)}
.pnlh .ar{font-size:10px;color:var(--acc);margin-left:auto}
.secH{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
 padding:3px 10px;border-radius:11px;display:inline-block;margin:0 0 7px}
.add{font-size:12px;color:var(--mut);border:1px dashed var(--line2);border-radius:10px;
 padding:8px 12px;background:transparent;width:100%;text-align:left;cursor:pointer;outline:none}
.add:hover{border-color:var(--acc);color:var(--acctx)}
input.add{color:var(--txt)}
input.add::placeholder{color:var(--mut)}
.tipo{font-size:9.5px;padding:1px 7px;border-radius:9px;font-weight:500;display:inline-block;white-space:nowrap}
.lb{font-size:10px;padding:2px 8px;border-radius:10px;white-space:nowrap;display:inline-block;font-weight:500}
/* --- etiquetas de tipo --- */
.tgc{font-size:9.5px;line-height:1.7;padding:1px 6px;border-radius:9px;font-weight:500;flex:none;width:var(--tgw,58px);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgi{font-size:9.5px;line-height:1.7;padding:1px 0;border-radius:9px;font-weight:600;flex:none;width:19px;text-align:center;white-space:nowrap}
.rdot{width:7px;height:7px;border-radius:50%;flex:none}
.tgrow{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--card);margin-bottom:5px;cursor:pointer}
.tgsw{width:15px;height:15px;border-radius:4px;flex:none;border:1px solid var(--line)}
.tgnm{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgn{font-size:9.5px;color:var(--hint);flex:none}
.tgar{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:5px;width:20px;height:20px;font-size:9px;line-height:1;padding:0;flex:none;cursor:pointer;font-family:inherit}
.tgar[disabled]{opacity:.3;cursor:default}
.tgexp{border:1px solid var(--acc);border-radius:11px;background:var(--card);padding:11px;margin-bottom:5px}
.tgfl{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px}
.tgin{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-family:inherit;font-size:12.5px;background:var(--bg);color:var(--txt);outline:none}
.tgstrip{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tgchip{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);padding:0;cursor:pointer}
.tgchip.on{border:2px solid var(--txt)}
.tgchip.off{opacity:.35;cursor:not-allowed}
.tim{font-size:10px;color:var(--hint)}
.grip{color:var(--line2);font-size:13px;line-height:1;flex:none;cursor:grab;touch-action:none;user-select:none;padding:2px 1px}
.grip:active{cursor:grabbing;color:var(--acc)}

/* ---------- lista corta ---------- */
.lcrow{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:13px;
 border-bottom:1px solid var(--line);flex-wrap:wrap}
.lcrow:last-of-type{border-bottom:none}
.lcrow.dragging{opacity:.4}
.lcrow.over{box-shadow:0 -2px 0 var(--acc)}
.lcrow.faded{opacity:.5}
.lcrow.faded .rt{font-size:11.5px}
.lcrow.done .rt{text-decoration:line-through;opacity:.42}
.rc{width:17px;height:17px;border:1.5px solid var(--line2);border-radius:5px;flex:none;background:#fff;
 display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff;cursor:pointer}
.rc.on{background:var(--grn);border-color:var(--grn)}
.rt{flex:1;min-width:150px;line-height:1.3;cursor:pointer;overflow-wrap:break-word}
.rnum{font-size:9.5px;font-weight:600;color:var(--hint);width:13px;text-align:center;flex:none}
.rx{font-size:11px;color:var(--hint);cursor:pointer;flex:none;padding:0 2px}
.rx:hover{color:var(--dan)}
.full{font-size:10.5px;color:var(--ambtx);background:var(--ambbg);border-radius:0 9px 9px 0;
 border-left:3px solid var(--amb);padding:7px 10px;margin-top:8px;line-height:1.5;
 display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.lcempty{font-size:11.5px;color:var(--hint);padding:4px 0 2px;line-height:1.5}
/* selector de vista */
.vsw{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.vb{font-size:11px;padding:4px 11px;border-radius:12px;border:1px solid var(--line);
 background:#fff;color:var(--mut);cursor:pointer;white-space:nowrap}
.vb:hover{border-color:var(--acc);color:var(--acctx)}
.vb.on{background:var(--accbg);border-color:var(--acc);color:var(--acctx);font-weight:600}
/* subtítulo de grupo */
.grpH{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:.07em;
 text-transform:uppercase;padding:9px 0 5px;border-bottom:1.5px solid var(--line);margin-top:6px}
.grpH:first-child{margin-top:0}
.gdot{width:8px;height:8px;border-radius:50%;flex:none}
.gn{margin-left:auto;font-weight:400;opacity:.6;letter-spacing:0}
/* editar en la propia lista */
.hchip{font-size:10px;padding:2px 8px;border-radius:9px;border:1px solid var(--line2);
 background:#fff;color:var(--acctx);cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.hchip.vacia{color:var(--hint);border-style:dashed}
.hchip:hover{border-color:var(--acc)}
.hin{font-size:12px;width:84px;padding:3px 7px;border:1px solid var(--acc);border-radius:9px;outline:none;color:var(--txt)}
.qeb{border:none;background:transparent;color:var(--line2);font-size:14px;line-height:1;
 cursor:pointer;flex:none;padding:0 3px}
.qeb:hover,.qeb.on{color:var(--acc)}
.qe{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin:2px 0 8px}
.qerow{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
.qerow:last-child{margin-bottom:0}
.qerow>label{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;width:104px;flex:none}
.qerow input,.qerow select{font-size:12.5px;color:var(--txt);background:#fff;border:1px solid var(--line2);
 border-radius:9px;padding:5px 9px;outline:none;flex:1;min-width:120px}
.qerow input:focus,.qerow select:focus{border-color:var(--acc)}
.qerow .frow{flex:1;display:flex;gap:7px;min-width:150px}
.dchips{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.dchip{font-size:10px;padding:3px 9px;border-radius:9px;border:1px solid var(--line);
 background:#fff;color:var(--mut);cursor:pointer;white-space:nowrap}
.dchip:hover{border-color:var(--acc)}
.dchip.on{font-weight:600}
/* zonas donde puedes soltar */
.mq.over{border-color:var(--acc);border-width:1.5px;background:var(--accbg)}
.grpH.over{background:var(--accbg);border-radius:8px}
/* estrella de la matriz */
.star{border:none;background:transparent;font-size:14px;line-height:1;color:var(--line2);
 cursor:pointer;flex:none;padding:0 2px}
.star.on{color:var(--amb)}
/* matriz */
.mtx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.mq{border:1px solid var(--line);border-radius:11px;padding:4px 10px 8px;min-width:0}
.mqh{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
 padding:4px 10px;border-radius:10px;display:block;margin:6px 0 2px}
.mqd{display:block;font-size:9px;font-weight:400;letter-spacing:.02em;text-transform:none;opacity:.75;margin-top:1px}
/* por horas */
.hrrow{display:flex;align-items:center;gap:10px}
.hrt{font-size:11px;font-weight:600;color:var(--acctx);width:44px;flex:none;
 font-variant-numeric:tabular-nums;text-align:right}
.hrb{flex:1;min-width:0}
/* bloque de selección */
.fchips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:4px 10px;
 border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--mut);cursor:pointer}
.fchip:hover{border-color:var(--acc)}
.fchip.on{font-weight:600}
.fsec{margin-top:10px}
.fcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:6px}
/* sección en modo pasos */
.sghrow{display:flex;align-items:center;gap:7px;margin-bottom:4px;flex-wrap:wrap}
.modo{font-size:9.5px;padding:2px 9px;border-radius:9px;border:1px solid var(--line);
 background:transparent;color:var(--hint);cursor:pointer;letter-spacing:.04em;text-transform:uppercase}
.modo.on{background:var(--accbg);border-color:var(--acc);color:var(--acctx);font-weight:600}
.pasos{padding:4px 0 2px}
.step{display:flex;gap:11px;position:relative;padding-bottom:10px;align-items:flex-start}
.step .line{position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.step.done .line{background:var(--grn);opacity:.4}
.step .num{width:27px;height:27px;border-radius:50%;flex:none;display:flex;align-items:center;
 justify-content:center;font-size:12px;font-weight:600;border:2px solid var(--line2);
 color:var(--hint);background:#fff;cursor:pointer;z-index:1}
.step.done .num{background:var(--grn);border-color:var(--grn);color:#fff}
.step.cur .num{border-color:var(--acc);color:var(--acctx);border-width:2.5px}
.step .sbody{flex:1;min-width:0;padding-top:4px}
.step .stx{font-size:13px;line-height:1.3;cursor:pointer;word-break:break-word}
.step.done .stx{text-decoration:line-through;opacity:.45}
.step.cur .stx{font-weight:600}
.substep{display:flex;gap:7px;align-items:center;font-size:11.5px;padding:3px 0;color:var(--mut)}
.substep.done span:nth-child(2){text-decoration:line-through;opacity:.5}
/* pasos: agarradera, flechas, quitar y subpasos */
.step .sgrip{align-self:center;margin-left:-4px}
.step.over{box-shadow:0 -2px 0 var(--acc)}
.step.dragging{opacity:.4}
.ach.over{box-shadow:0 -2px 0 var(--acc)}
/* «＋ bloque» en lo que estoy trabajando */
.fchip .fx{font-size:9px;opacity:.55;margin-left:2px}
.fchip.fadd{border-style:dashed;color:var(--mut)}
.fmenu{flex-basis:100%;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:4px;margin-top:2px}
.fitem{display:flex;align-items:center;gap:7px;border:none;background:none;font-family:inherit;font-size:12px;color:var(--txt);padding:7px 8px;border-radius:7px;text-align:left;cursor:pointer}
.fitem:hover{background:var(--soft)}
.ach.dragging{opacity:.4}
.ach .mv{width:20px;height:20px;flex:none}
.ach .grip{margin-right:-4px}
.sacc{display:flex;align-items:center;gap:3px;flex:none;align-self:flex-start;padding-top:3px}
.mv{width:22px;height:22px;border:1px solid var(--line2);border-radius:6px;background:var(--card);color:var(--mut);font-size:9px;cursor:pointer;padding:0}
.mv:disabled{opacity:.3;cursor:default}
.sx{color:var(--hint);cursor:pointer;font-size:10px;padding:0 2px}
.stin{border:1px solid transparent;border-radius:6px;background:transparent;font-family:inherit;color:var(--txt);padding:2px 5px;margin-left:-5px;outline:none;min-width:0;flex:1}
.stin:focus{border-color:var(--acc);background:#fff}
.subedit{flex:1;border:1px solid var(--acc);border-radius:6px;font-family:inherit;font-size:11.5px;color:var(--txt);padding:2px 6px;outline:none;min-width:0}
.subadd{border:none;background:transparent;font-family:inherit;font-size:11.5px;color:var(--txt);padding:3px 0 0 24px;width:100%;outline:none}
.subadd::placeholder{color:var(--hint)}

/* ---------- avisos y tira de días ---------- */
.alert{border-radius:0 10px 10px 0;padding:9px 12px;font-size:12px;display:flex;gap:9px;
 align-items:center;flex-wrap:wrap;margin-bottom:10px}
.alert.dan{background:var(--danbg);border-left:3px solid var(--dan);color:var(--dantx)}
.alert.amb{background:var(--ambbg);border-left:3px solid var(--amb);color:var(--ambtx)}
.alert.blu{background:var(--blubg);border-left:3px solid var(--blu);color:var(--blutx)}
.chipday{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin-bottom:13px;-webkit-overflow-scrolling:touch}
.cd{flex:none;background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 9px;min-width:106px;max-width:150px}
.cd.hoy{border-color:var(--acc);background:var(--accbg)}
.cd .cdd{font-size:9px;color:var(--hint);text-transform:uppercase;letter-spacing:.05em}
.cd.hoy .cdd{color:var(--acctx)}
.cd .cdh{font-size:12.5px;font-weight:600;margin-top:1px}
.cd.hoy .cdh{color:var(--acctx)}
.cd .cdt{font-size:10px;color:var(--mut);line-height:1.3;margin-top:2px}
.cd.hoy .cdt{color:var(--acctx)}
.cd .cdl{font-size:10px;color:var(--mut);line-height:1.35}

/* ---------- ficha modo Ahora ---------- */
.nc{background:var(--card);border:1px solid var(--line);border-radius:11px;
 padding:12px 13px 12px 16px;margin-bottom:7px;display:flex;align-items:center;gap:11px;position:relative;cursor:pointer}
.abar{position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:11px 0 0 11px}
.ck{width:19px;height:19px;border:1.6px solid var(--line2);border-radius:6px;flex:none;background:#fff;
 display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#fff;cursor:pointer}
.ck.on{background:var(--grn);border-color:var(--grn)}
.nb{flex:1;min-width:0}
.ntx{font-size:14.5px;font-weight:400;line-height:1.25;word-break:break-word}
.nc.done .ntx{text-decoration:line-through;opacity:.42}
.nmeta{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
.anm{font-size:10.5px;font-weight:500}
.big{font-size:15px;font-weight:600;white-space:nowrap}
.vencido{font-size:9.5px;padding:2px 8px;border-radius:9px;background:var(--danbg);color:var(--dantx);font-weight:600;white-space:nowrap}
.nc.over{background:#F8E3DE;border-color:#EEC9BC}
.nowempty{font-size:12.5px;color:var(--grntx);background:var(--grnbg);border-radius:11px;padding:16px 14px;text-align:center;line-height:1.6}
.nowempty small{display:block;font-size:11px;opacity:.78;margin-top:4px}
.bar{height:7px;background:#EFEAE2;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--grn)}

/* ---------- página: contenido a la izquierda, paneles de consulta a la derecha ---------- */
#page{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;align-items:start}
#colA,#sideCol{min-width:0}
body.modo-now #page{display:block;max-width:780px}
body.modo-now #sideCol{display:none}
/* pestaña Mi día: solo el armado del día (y la tarjeta Ahora) */
body.modo-dia #page{display:block;max-width:1100px}
body.modo-dia #sideCol,body.modo-dia #shortBox,body.modo-dia #focoBox,body.modo-dia #diaBox{display:none!important}
.mdhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mdh{font-size:12px;color:var(--mut);margin-left:auto}
.mdh select{font-family:inherit;font-size:12px;border:1px solid var(--line2);border-radius:7px;padding:2px 4px;background:#fff;color:var(--txt)}
.mdmeter{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-top:8px}
.mdcols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;align-items:start}
.mdit{display:flex;gap:9px;align-items:flex-start;padding:4px 0}
.mdit.hecho .mdbd b{text-decoration:line-through;opacity:.45}
.mdit.ahora .mdbd b{color:var(--acctx)}
.mdtm{width:52px;flex:none;text-align:right;font-size:11px;font-weight:600;color:var(--mut);padding-top:3px;font-variant-numeric:tabular-nums}
.mdpill{width:26px;flex:none;border:1px solid;border-left-width:4px;border-radius:6px}
.mdit.hecho .mdpill{opacity:.45}
.mdbd{flex:1;min-width:0;padding-top:2px}
.mdbd b{display:block;font-weight:600;font-size:13px;line-height:1.3;cursor:pointer;word-break:break-word}
.mdbd span{font-size:11px;color:var(--mut)}
.mdacc{display:flex;gap:4px;align-items:center;flex:none}
.mdgap{display:flex;align-items:center;gap:9px;padding:2px 0;border-radius:8px}
.mdgap.over{outline:1.5px dashed var(--acc)}
.mdline{width:52px;flex:none}
.mdline::after{content:"";display:block;margin-left:calc(100% + 20px);border-left:1.5px dashed var(--line2);height:24px}
.mdgt{font-size:11px;color:var(--hint);cursor:pointer;margin-left:26px}
.mdgt b{font-weight:600;color:var(--acctx);border:1px dashed var(--acc);border-radius:7px;padding:1px 7px;margin-left:4px}
.mdgap.on .mdgt{color:var(--acctx)}
.mdsug{margin:2px 0 6px 87px;border:1px solid var(--acc);border-radius:10px;background:var(--accbg);padding:7px}
.mdsugh{font-size:10.5px;font-weight:600;color:var(--acctx);letter-spacing:.04em;margin-bottom:4px}
.mdcand{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:6px 8px;margin-bottom:4px;cursor:pointer;font-size:12.5px}
.mdcand.dragging{opacity:.4}
.mdcand .mdt{flex:1;min-width:0;line-height:1.3}
.du{font-size:10.5px;background:var(--soft);border-radius:6px;padding:1px 6px;color:var(--mut);flex:none;white-space:nowrap}
.mdgrp{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin:8px 0 4px}
.mdpick{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.mdpa{display:flex;align-items:center;gap:7px;padding:7px 2px;cursor:pointer;font-size:12.5px;font-weight:600}
.mdpa .n{font-weight:400;color:var(--hint);font-size:11px}
.mdpa .ar{margin-left:auto}
.mdpt{display:flex;gap:8px;align-items:flex-start;padding:5px 2px 5px 16px;font-size:12px;cursor:pointer}
@media(max-width:760px){.mdcols{grid-template-columns:1fr}.mdsug{margin-left:0}}

/* ---------- áreas modo Todo: dos columnas ---------- */
#grid{column-count:2;column-gap:10px}
.ac{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:8px;
 overflow:hidden;break-inside:avoid;-webkit-column-break-inside:avoid;display:inline-block;width:100%}
.ach{display:flex;align-items:center;gap:9px;padding:10px 13px;cursor:pointer;background:var(--soft);
 border-bottom:1px solid var(--line);flex-wrap:wrap}
.ach.closed{border-bottom:none}
.adot{width:9px;height:9px;border-radius:50%;flex:none}
.aname{font-size:13.5px;font-weight:600;flex:1;min-width:0}
.acount{font-size:10.5px;color:var(--hint)}
.ar{font-size:10px;color:var(--acc)}
.ahide{font-size:9.5px;color:var(--hint);cursor:pointer;opacity:.6;letter-spacing:.04em;text-transform:uppercase}
.ahide:hover{opacity:1;color:var(--acctx)}

.acb{padding:9px 11px 10px}
.sgsec{min-width:0}
.sgsec+.sgsec{margin-top:13px}
.sgh{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
 padding:3px 9px;border-radius:10px;display:inline-block;margin:0 0 4px;cursor:text}
.sgh.drop{outline:1px dashed var(--acc);outline-offset:2px}
.sgdel{margin-left:5px;opacity:.5;cursor:pointer}
.sgdel:hover{opacity:1}
.t{display:flex;gap:8px;align-items:center;padding:6px 2px 6px 11px;border-bottom:1px solid var(--line);
 position:relative;min-height:44px;cursor:pointer}
.t:last-of-type{border-bottom:none}
.t.dragging{opacity:.4}
.t.over{box-shadow:0 -2px 0 var(--acc)}
.fdur{position:absolute;left:0;width:3.5px;border-radius:2px;top:50%;transform:translateY(-50%)}
.tck{width:17px;height:17px;border:1.6px solid var(--line2);border-radius:5px;flex:none;background:#fff;
 display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff;cursor:pointer}
.tck.on{background:var(--grn);border-color:var(--grn)}
.nm{flex:1;min-width:0}
.nm b{font-weight:400;font-size:12.5px;display:block;line-height:1.25;word-break:break-word}
.t.done .nm b{text-decoration:line-through;opacity:.42}
.sb{display:flex;gap:5px;align-items:center;margin-top:3px;flex-wrap:wrap}
.dt{font-size:10px;color:var(--mut);white-space:nowrap;text-align:right;line-height:1.2}
.dt b{font-weight:600}
.u1{background:#F8E3DE;border-radius:0 9px 9px 0;border-bottom-color:transparent}
.u2{background:#F7E7DE;border-radius:0 9px 9px 0;border-bottom-color:transparent}
.u3{background:#F3EDDF;border-radius:0 9px 9px 0;border-bottom-color:transparent}
.up{width:25px;height:25px;border-radius:50%;border:1px solid var(--line2);background:#fff;
 color:var(--acc);font-size:12px;line-height:1;flex:none;cursor:pointer;padding:0}
.up.on{background:var(--acc);border-color:var(--acc);color:#fff}
.addsm{font-size:11.5px;color:var(--mut);border:1px dashed var(--line2);border-radius:10px;
 padding:7px 10px;background:transparent;width:100%;text-align:left;margin-top:6px;outline:none}
.addsm::placeholder{color:var(--hint)}
.hidbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}

/* ---------- calendario ---------- */
.calnav{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--mut);margin-bottom:6px}
.calnav b{font-weight:600;flex:1;text-align:center;color:var(--txt)}
.calnav b::first-letter{text-transform:uppercase}
.calnav span{color:var(--acc);cursor:pointer;font-size:14px;padding:0 4px;user-select:none}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-bottom:8px}
.cal .dow{font-size:8.5px;color:var(--hint);text-align:center;padding:2px 0;text-transform:uppercase;letter-spacing:.04em}
.cal .cell{font-size:9.5px;text-align:center;padding:3px 0 4px;border-radius:7px;color:var(--mut);min-height:24px}
.cal .cell.today{background:var(--accbg);color:var(--acctx);font-weight:600}
.dots{display:flex;gap:1.5px;justify-content:center;margin-top:1px;height:4px}
.dots i{width:3.5px;height:3.5px;border-radius:50%}
.prow{display:flex;align-items:center;gap:8px;padding:7px 8px;margin:0 -8px;border-radius:9px;
 border-bottom:1px solid var(--line);font-size:12px;cursor:pointer;flex-wrap:wrap}
.prow:last-child{border-bottom:none}
.prow.venc{background:var(--danbg);border-bottom-color:transparent}
.prow.hoy{background:var(--accbg);border-bottom-color:transparent}
.prow.man{background:var(--ambbg);border-bottom-color:transparent}
.pd{font-size:9.5px;font-weight:600;flex:none;padding:2px 8px;border-radius:9px;
 white-space:nowrap;text-align:center;min-width:56px;letter-spacing:.02em}
.pt{flex:1;min-width:0;line-height:1.25;word-break:break-word}
.prow.done .pt{text-decoration:line-through;opacity:.42}
.pw{font-size:9.5px;color:var(--hint);white-space:nowrap;font-variant-numeric:tabular-nums}
.pdot{width:7px;height:7px;border-radius:50%;flex:none}

/* ---------- archivo ---------- */
.arch{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:12px;color:var(--mut)}
.arch.drop{border-color:var(--grn);background:var(--grnbg)}
/* tarjeta «Ahora» y franja «Tu día» */
.ahora{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-bottom:10px}
.ahtop{display:flex;align-items:center;gap:10px}
.ahtx{flex:1;min-width:0;cursor:pointer}
.ahcap{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--acctx)}
.ahnom{font-size:16px;font-weight:600;margin-top:2px;line-height:1.25;word-break:break-word}
.ahnum{font-size:30px;font-weight:600;color:var(--acctx);line-height:1;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.ahnum small{display:block;font-size:10.5px;font-weight:400;color:var(--mut)}
.ahnum em{display:block;font-style:normal;font-size:10.5px;font-weight:400;color:var(--mut)}
.ahbar{height:6px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:8px}
.ahbar i{display:block;height:100%;background:var(--acc)}
.ahpie{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:11.5px;color:var(--mut)}
.ahpie span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtrack{position:relative;height:22px;border-radius:6px;background:var(--soft);overflow:hidden}
.dseg{position:absolute;top:0;bottom:0;border-radius:3px;cursor:pointer}
.dnow{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--txt)}
.dmarcas{position:relative;height:14px;margin-top:3px}
.dmarcas span{position:absolute;transform:translateX(-50%);font-size:9.5px;color:var(--hint);white-space:nowrap}
.dmarcas span:first-child{transform:none}
/* destinos para arrastrar en la vista Por bloque */
.dests{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.dchipB{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--mut);border:1px dashed var(--line2);
 border-radius:9px;padding:4px 9px;background:var(--card)}
.dchipB.caj{background:var(--soft)}
/* widgets del iPhone, en el menú */
.wgit{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.wgmini{width:58px;height:60px;background:#FBF9F5;border:1px solid var(--line2);border-radius:10px;padding:5px;flex:none;
 display:flex;flex-direction:column;gap:2.5px;overflow:hidden}
.wgcode{background:var(--soft);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:500;color:var(--txt);word-break:break-word}
.dchipB.over{border-style:solid;border-color:var(--acc);color:var(--acctx);background:var(--accbg)}
/* bloque aparte, en la columna lateral: una columna, letra más chica */
.blksel{font-size:11px;color:var(--txt);background:#fff;border:1px solid var(--line2);border-radius:7px;padding:3px 6px;
 font-family:inherit;max-width:100%}
.sideblk .sgh{font-size:9px;margin-top:8px}
.sideblk .t{min-height:32px;padding:4px 2px 4px 9px;gap:6px}
.sideblk .nm b{font-size:11px}
.sideblk .tim,.sideblk .tipo{font-size:9px}
.sideblk .dt{font-size:9.5px}
.sideblk .up{transform:scale(.85)}
.arow{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:11.5px}
.arow .atx{flex:1;min-width:0;text-decoration:line-through;opacity:.55;word-break:break-word}

/* ---------- modal / hoja ---------- */
.ov{position:fixed;inset:0;background:rgba(40,34,28,.42);display:flex;align-items:center;
 justify-content:center;padding:16px;z-index:50}
.md{background:var(--card);border-radius:16px;padding:15px 16px;width:100%;max-width:430px;max-height:88vh;overflow-y:auto}
@supports (height:100dvh){.md{max-height:88dvh}}
.titin{width:100%;font-size:15px;font-weight:500;color:var(--txt);
 border:none;border-bottom:1px solid var(--line);border-radius:0;padding:3px 0 7px;background:transparent;outline:none}
.titin:focus{border-bottom-color:var(--acc);border-width:0 0 1.5px}
.dscin{width:100%;font-size:12.5px;line-height:1.5;color:var(--mut);border:none;background:transparent;
 border-bottom:1px dashed var(--line);padding:6px 0 8px;resize:none;overflow:hidden;outline:none;margin-top:6px;
 min-height:38px;display:block}
.dscin:focus{background:var(--soft);border:1px solid var(--acc);border-radius:9px;padding:7px 9px;color:var(--txt)}
.fld{margin-top:11px}
.fld label{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.fld input,.fld select{width:100%;font-size:13px;color:var(--txt);background:#fff;
 border:1px solid var(--line2);border-radius:9px;padding:7px 10px;outline:none}
.fld input:focus,.fld select:focus{border-color:var(--acc)}
.frow{display:flex;gap:8px}
.frow>*{flex:1;min-width:0}
.regla{position:relative;height:20px;margin:13px 11px 0}
.rtrack{position:absolute;left:0;right:0;top:8px;height:3px;background:#EFEAE2;border-radius:2px}
.rmk{position:absolute;top:3px;width:13px;height:13px;border-radius:50%;background:#fff;
 border:2px solid var(--line2);transform:translateX(-50%);padding:0;cursor:pointer}
.rmk.on{width:19px;height:19px;top:0}
.rlabels{display:flex;justify-content:space-between;font-size:9px;color:var(--hint);margin:6px 0 0}
.rlabels span{flex:1;text-align:center;min-width:0}
.swbox{display:flex;align-items:center;gap:10px;background:#EFEAE2;border-radius:11px;padding:9px 11px;margin-top:11px;cursor:pointer}
.swbox.on{background:var(--accbg)}
.knob{width:36px;height:20px;border-radius:12px;background:var(--line2);position:relative;flex:none;transition:background .15s}
.swbox.on .knob{background:var(--acc)}
.knob i{position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.swbox.on .knob i{left:18px}
.stp{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12.5px;border-bottom:1px solid var(--line)}
.stp:last-of-type{border-bottom:none}
.sc{width:15px;height:15px;border:1.5px solid var(--line2);border-radius:4px;flex:none;background:#fff;
 display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:#fff;cursor:pointer}
.sc.on{background:var(--grn);border-color:var(--grn)}
.stp.done .stt{text-decoration:line-through;opacity:.42}
.stt{flex:1;min-width:0;word-break:break-word}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts button{font-size:13px;padding:9px 15px;border-radius:11px;border:1px solid var(--line2);
 background:#fff;color:var(--txt);flex:1;cursor:pointer;min-width:74px}
.acts button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.acts button.del{flex:none;color:var(--dan);background:var(--danbg);border-color:var(--danbg)}

/* ---------- decodificador ---------- */
.decrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.decrow:last-child{border-bottom:none}
.decs{width:66px;flex:none;display:flex;align-items:center;justify-content:center}
.dect{flex:1;min-width:0;font-size:11.5px;line-height:1.45}
.dect b{font-size:12px;font-weight:600;display:block}
.dect span{color:var(--mut)}
.dect em{font-style:normal;font-weight:600;color:var(--dantx)}
.scaleN{display:flex;gap:3px;align-items:flex-end;height:30px}
.scaleN i{width:5px;border-radius:3px}

function leeDur(s){s=String(s||'').toLowerCase().replace(',','.').trim();if(!s)return null;
 let m=s.match(/^(\d+):(\d{1,2})$/);if(m)return (+m[1])*60+(+m[2]);
 let h=0,mi=0,ok=false;
 m=s.match(/([\d.]+)\s*(h|hr|hrs|hora|horas)\b/);if(m){h=parseFloat(m[1]);ok=true;s=s.replace(m[0],' ');}
 m=s.match(/([\d.]+)\s*(m|min|mins|minutos?)?\s*$/);if(m&&m[1]){mi=parseFloat(m[1]);if(!ok&&!m[2]&&mi<=12&&/h/.test(s))mi*=60;ok=true;}

   const tk=tkById(e.id);if(!tk||state[tk.id]||archived[tk.id])return;
   cortaN++;if(corta.length<25)corta.push(meta(tk));});
 const ahora=Date.now();
 const conHora=TK().filter(t=>activo(t)&&parseDT(t)&&parseDT(t).getTime()>ahora-3600000)
   .sort((a,b)=>parseDT(a)-parseDT(b)).slice(0,6).map(meta);
 const hoyMan=TK().filter(t=>{if(!activo(t))return false;const d=dateOf(t);if(!d)return false;
   return dayDiff(d)<=1;}).sort((a,b)=>dayDiff(dateOf(a))-dayDiff(dateOf(b))).slice(0,8).map(meta);
 const atras=TK().filter(t=>activo(t)&&overdue(t)).length;

 /* cuadrantes de la matriz, con lo que tú arrastraste ya respetado */
 const QN=['Hazlo ya','Agéndalo','Sácatelo rápido','¿De verdad?'];
 const cuad=QN.map(n=>({n:n,c:0,it:[]}));
 short.forEach(e=>{
   let t='',col='#8A7263';
   if(e.free){if(e.done)return;t=e.t;}
   let gg=null;
   if(!e.free){const tk=tkById(e.id);if(!tk||state[tk.id]||archived[tk.id])return;
        t=txtOf(tk);col=colOf(areaObjOf(tk)).sol;gg=tgBlob(tk.id);}
   const q=quadDe(e);cuad[q].c++;
   if(cuad[q].it.length<3){const o={t:t,c:col};if(gg)o.g=gg;cuad[q].it.push(o);}});

 /* los próximos días, para la tira de la semana */
 const semana=[];
 for(let i=0;i<6;i++){const dd=addDays(todayStr(),i);
   const ev=TK().filter(t=>activo(t)&&dateOf(t)===dd&&timeOf(t))
     .sort((a,b)=>(parseDT(a)||0)-(parseDT(b)||0)).slice(0,2)
     .map(t=>{const o={h:timeOf(t),t:txtOf(t)};const g=tgBlob(t.id);if(g)o.g=g;return o;});
   semana.push({d:dd,ev:ev});}

 /* cada bloque con sus secciones — para los widgets por bloque */
 const bloques=[];
 areas().forEach(a=>{
   if(hiddenB[a.key])return;
   const c=colOf(a);
   const mias=TK().filter(t=>areaOf(t)===a.key&&activo(t));
   if(a.inbox&&!mias.length)return;
   const secs=[];
   sgNames(a).slice(0,8).forEach(sg=>{
     const todas=tasksFor(a.key,sg).filter(t=>!state[t.id]);   // solo las pendientes
     if(!todas.length)return;
     secs.push({n:labelOv[a.key+'|'+sg]||sg,p:!!stepMode[a.key+'|'+sg],
       ts:todas.slice(0,10).map(tk=>{const o={t:txtOf(tk),f:dateOf(tk)||'',h:timeOf(tk)||'',d:!!state[tk.id]};
         const g=tgBlob(tk.id);if(g)o.g=g;return o;})});});
   bloques.push({k:a.key,n:a.name,c:c.sol,bg:c.bg,tx:c.tx,
     pend:mias.length,venc:mias.filter(overdue).length,
     sem:mias.filter(t=>{const d=dateOf(t);if(!d)return false;const n=dayDiff(d);return n>=0&&n<=7;}).length,
     secs:secs});});

 const hechas=doneToday();
 const porHacerHoy=TK().filter(t=>{if(!activo(t))return false;const d=dateOf(t);return !!(d&&dayDiff(d)<=0);}).length;

 /* colores de cada bloque, en el orden de la agenda (para agrupar la lista corta) */
 const colores=areas().filter(a=>!hiddenB[a.key]).map(a=>{const c=colOf(a);return {k:a.key,n:a.name,c:c.sol,bg:c.bg,tx:c.tx};});
 /* calendario: lo que tiene fecha desde el día 1 de este mes */
 const mes1=todayStr().slice(0,8)+'01';
 const cal=TK().filter(t=>activo(t)&&dateOf(t)&&dateOf(t)>=mes1)
   .sort((a,b)=>(dateOf(a)<dateOf(b)?-1:dateOf(a)>dateOf(b)?1:(minutos(timeOf(a))??9999)-(minutos(timeOf(b))??9999)))
   .slice(0,60).map(t=>({f:dateOf(t),h:timeOf(t)||'',t:txtOf(t),c:colOf(areaObjOf(t)).sol}));

 /* para los avisos de Pushover (los lee Supabase): tareas con fecha de hace 7 días a 40 días,
    con hora en HH:MM de 24 h, duración en minutos y si se repite; y desde cuándo está cada cosa en «importa ahorita» */
 const hhmm=m=>m==null?'':String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
 const ag=TK().filter(t=>{if(!activo(t))return false;const f=dateOf(t);if(!f)return false;const n=dayDiff(f);return n>=-7&&n<=40;})
   .slice(0,200).map(t=>({i:t.id,t:txtOf(t),f:dateOf(t),h:hhmm(minutos(timeOf(t))),d:minutosDe(t.id)||0,r:repLabel(repOf(t)),b:(areaObjOf(t)||{}).name||''}));
 const sh=[];short.forEach(e=>{
   if(e.free){if(!e.done)sh.push({t:e.t,a:e.at||''});return;}
   const tk=tkById(e.id);if(!tk||state[tk.id]||archived[tk.id])return;sh.push({t:txtOf(tk),a:e.at||''});});

 return {v:3,ts:new Date().toISOString(),atrasadas:atras,cortaN:cortaN,colores:colores,cal:cal,av:{ag:ag,sh:sh},
         pendientes:TK().filter(activo).length,
         hoyHechas:hechas,hoyTotal:hechas+porHacerHoy,
         corta:corta,conHora:conHora,hoyManana:hoyMan,
         cuadrantes:cuad,semana:semana,bloques:bloques,
         etiquetas:tags.map(t=>{const c=tagPal(t);
           return {id:t.id,n:t.n,i:tagIni(t),bg:c.bg,tx:c.tx};})};}

/* "Base" = cómo estaba todo la última vez que este dispositivo y la nube coincidieron.
   Sirve para saber qué cambiaste TÚ aquí desde entonces (y no tirarlo si la nube cambió también). */
function baseGet(){try{return JSON.parse(localStorage.getItem('agenda_syncbase')||'null');}catch(e){return null;}}
function baseSet(o){try{localStorage.setItem('agenda_syncbase',JSON.stringify(o));}catch(e){}}
let cambios=0;   // sube con cada save(); así un cambio hecho mientras se sube no se pierde
async function doPush(){const ts=new Date().toISOString();const n=cambios;const blob=localBlob();const body=[{code:syncCode,data:blob,updated_at:ts}];
 let wErr="";
 try{body.push({code:syncCode+"__widget",data:widgetBlob(),updated_at:ts});}catch(e){wErr=' · ⚠ el widget no se armó: '+(e.message||e);}
 const r=await fetch(SUPA_URL+"/rest/v1/agenda_sync?on_conflict=code",{method:"POST",headers:Object.assign({},SUPA_HDR,{Prefer:"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify(body)});
 if(r.ok){localStorage.setItem('agenda_remote_ts',ts);baseSet(blob);widgetTs=Date.now();
   dirty=(cambios!==n);if(dirty)schedulePush();
   setSyncStatus('✓ guardado en la nube'+wErr);return true;}
 setSyncStatus('error al guardar ('+r.status+')');return false;}
/* solo el resumen del widget (otra fila): no toca tus datos, así que no provoca rebotes entre dispositivos */
let widgetTs=0;
async function pushWidget(){if(!syncCode||location.protocol==='file:')return;
 let data;try{data=widgetBlob();}catch(e){setSyncStatus('⚠ el widget y los avisos no se armaron: '+(e.message||e));widgetTs=Date.now();return;}
 try{await fetch(SUPA_URL+"/rest/v1/agenda_sync?on_conflict=code",{method:"POST",headers:Object.assign({},SUPA_HDR,{Prefer:"resolution=merge-duplicates,return=minimal"}),
   body:JSON.stringify([{code:syncCode+"__widget",data:data,updated_at:new Date().toISOString()}])});widgetTs=Date.now();}catch(e){}}
/* La nube cambió Y tú también cambiaste algo aquí: se juntan en vez de tirar lo tuyo.
   Por cada dato: si lo cambiaste aquí desde la última vez, gana lo tuyo; si no, se toma el de la nube. */
async function mergeCloud(){
 const r=await fetch(SUPA_URL+"/rest/v1/agenda_sync?code=eq."+encodeURIComponent(syncCode)+"&select=data,updated_at",{headers:SUPA_HDR});
 if(!r.ok){setSyncStatus('error al leer ('+r.status+')');return;}
 const rows=await r.json();if(!rows.length){await doPush();return;}
 const remote=rows[0].data||{},local=localBlob(),base=baseGet()||remote;
 const llaves=new Set(Object.keys(remote).concat(Object.keys(local),Object.keys(base)));
 const junto={};let cambiaAqui=false;
 llaves.forEach(k=>{if(esUI(k))return;const l=local[k],v=(l!==base[k])?l:remote[k];
   if(v!==undefined)junto[k]=v;if(v!==l)cambiaAqui=true;});
 if(cambiaAqui){
   Object.keys(localStorage).forEach(k=>{if(k.indexOf('agenda_')===0&&!esUI(k)&&!(k in junto))localStorage.removeItem(k);});
   Object.keys(junto).forEach(k=>localStorage.setItem(k,junto[k]));}
 localStorage.setItem('agenda_remote_ts',rows[0].updated_at);
 const ok=await doPush();                  // sube lo ya juntado
 if(ok&&cambiaAqui)location.reload();      // recarga solo si llegó algo de la nube
}
async function syncCycle(){
 if(!syncCode||cloudBusy)return;if(offlineFileWarn())return;cloudBusy=true;
 try{
   const r=await fetch(SUPA_URL+"/rest/v1/agenda_sync?code=eq."+encodeURIComponent(syncCode)+"&select=updated_at",{headers:SUPA_HDR});
   if(!r.ok){setSyncStatus('error al leer ('+r.status+')');cloudBusy=false;return;}
   const rows=await r.json();const remoteTs=rows.length?rows[0].updated_at:'';const localTs=localStorage.getItem('agenda_remote_ts')||'';
   if(!rows.length){await doPush();cloudBusy=false;return;}   // nube vacía: se sube lo de aquí
   if(remoteTs&&remoteTs>localTs){
     if(isEditingNow()){setSyncStatus('hay cambios en la nube… termina de editar');cloudBusy=false;return;}
     if(dirty&&baseGet()){await mergeCloud();cloudBusy=false;return;}   // antes: se tiraba lo que acababas de cambiar
     cloudBusy=false;await applyCloud(false);return;
   }
   if(dirty){await doPush();}
   else{setSyncStatus('✓ al día');if(Date.now()-widgetTs>15*60*1000)pushWidget();}
 }catch(e){setSyncStatus('sin conexión');}
 cloudBusy=false;
}
async function syncNow(){setSyncStatus('sincronizando…');await syncCycle();}
async function forcePull(){if(!syncCode){setSyncStatus('Escribe tu código y conecta primero.');return;}if(offlineFileWarn())return;
 if(!confirm('Esto REEMPLAZA lo de ESTE dispositivo con lo de la nube. ¿Continuar?'))return;
 setSyncStatus('Trayendo de la nube…');await applyCloud(true);}
async function forcePush(){if(!syncCode){setSyncStatus('Escribe tu código y conecta primero.');return;}if(offlineFileWarn())return;
 if(!confirm('Esto REEMPLAZA lo de la nube con lo de ESTE dispositivo. ¿Continuar?'))return;
 setSyncStatus('Subiendo a la nube…');await doPush();}
function connectSync(){const v=document.getElementById('syncCodeInput').value.trim();if(!v){setSyncStatus('Escribe un código.');return;}
  syncCode=v;localStorage.setItem('agenda_synccode',v);setSyncStatus('Conectando…');
  /* dispositivo nuevo (sin base): manda la nube; si la nube está vacía, sube lo de aquí */
  localStorage.removeItem('agenda_syncbase');localStorage.removeItem('agenda_remote_ts');dirty=false;
  syncCycle().then(()=>setSyncStatus('✓ conectado como "'+v+'"'));}

/* --- etiquetas de tipo --- */
function tagById(id){return id?(tags.find(t=>t.id===id)||null):null;}
function tagPal(t){return (t&&TGPAL.find(p=>p.k===t.c))||TGGRIS;}
function tagDe(taskId){return tagById(tagOv[taskId]);}
function tagIni(t){return (t.i||(t.n||'?').trim().charAt(0)||'?').toUpperCase();}
/* el ancho de la columna se saca del nombre más largo del catálogo */
function tgWidth(){let m=2;tags.forEach(t=>{m=Math.max(m,(t.n||'').length);});
 const w=Math.min(74,Math.max(32,Math.round(m*5.6+16)));
 document.documentElement.style.setProperty('--tgw',w+'px');}
/* columna de ancho fijo, para la rejilla de bloques. Sin etiqueta = pastilla gris con guion. */
function tgCol(taskId){const t=tagDe(taskId);const c=t?tagPal(t):TGGRIS;
 return `<span class="tgc" style="background:${c.bg};color:${c.tx}" title="${t?esc(t.n):'sin etiqueta'}">${t?esc(t.n):'—'}</span>`;}
/* solo la inicial, para la matriz */
function tgIniHTML(taskId){const t=tagDe(taskId);if(!t)return"";const c=tagPal(t);
 return `<span class="tgi" style="background:${c.bg};color:${c.tx}" title="${esc(t.n)}">${esc(tagIni(t))}</span>`;}
/* inicial con lugar fijo, para paneles angostos. Sin etiqueta = pastilla gris con guion. */
function tgIniSlot(taskId){const t=tagDe(taskId);const c=t?tagPal(t):TGGRIS;
 return `<span class="tgi" style="background:${c.bg};color:${c.tx}" title="${t?esc(t.n):'sin etiqueta'}">${t?esc(tagIni(t)):'–'}</span>`;}
/* pastilla normal, para la lista corta. Si no tiene etiqueta no pinta nada. */
function tgPill(taskId){const t=tagDe(taskId);if(!t)return"";const c=tagPal(t);
 return `<span class="tipo" style="background:${c.bg};color:${c.tx}">${esc(t.n)}</span>`;}
/* lo que viaja al widget: nombre visible + los dos colores, nunca solo el id */
function tgBlob(taskId){const t=tagDe(taskId);if(!t)return null;const c=tagPal(t);
 return {id:t.id,n:t.n,i:tagIni(t),bg:c.bg,tx:c.tx};}

function areas(){const l=[INBOX].concat(SEED,customAreas).filter(a=>!deletedAreas[a.key]);
 if(!blockOrder.length)return l;          // el orden que tú elegiste; los bloques nuevos van al final
 const pos=k=>{const i=blockOrder.indexOf(k);return i<0?999:i;};
 return l.map((a,i)=>({a,i})).sort((x,y)=>(pos(x.a.key)-pos(y.a.key))||(x.i-y.i)).map(x=>x.a);}
function areaByKey(k){return [INBOX].concat(SEED,customAreas).find(a=>a.key===k);}
function colOf(a){ // acepta el formato viejo (bg/fg/sgfg) y el nuevo (sol/bg/tx)
 if(!a)return{sol:"#8A7263",bg:"#EDE5DF",tx:"#5A4437"};
 if(a.sol)return{sol:a.sol,bg:a.bg,tx:a.tx};
 return {sol:a.sgfg||a.fg||"#8A7263",bg:a.bg||"#EDE5DF",tx:a.fg||"#5A4437"};}
function sgNames(area){const del=deletedSg[area.key]||{};return area.groups.map(g=>g.sg).concat(customSg[area.key]||[]).filter(s=>!del[s]);}
function allTasks(){
 const out=[];
 areas().forEach(area=>area.groups.forEach((grp,gi)=>grp.items.forEach((it,ii)=>{
   out.push({id:area.key+"|"+gi+"|"+ii,area:area.key,baseSg:grp.sg,t:it.t,hoy:it.hoy,tiimoDef:!!it.tiimo,meta:it.meta||"",date:it.date||"",time:it.time||"",rep:it.rep||""});
 })));
 custom.forEach(c=>out.push({id:c.id,area:c.area,baseSg:c.sg,t:c.t,hoy:0,tiimoDef:false,meta:"",date:"",time:"",rep:""}));
 return out;
}
let TKCACHE=null;
function TK(){if(!TKCACHE)TKCACHE=allTasks();return TKCACHE;}
function tkById(id){return TK().find(t=>t.id===id);}
function areaOf(tk){return areaOv[tk.id]||tk.area;}
function areaObjOf(tk){return areaByKey(areaOf(tk));}
function sgOf(tk){return sgOv[tk.id]||tk.baseSg;}
function txtOf(tk){return textOv[tk.id]||tk.t;}
function dateOf(tk){return dateOv[tk.id]||tk.date;}
function repOf(tk){return repeatOv[tk.id]||tk.rep||"";}
function timeOf(tk){return (tk.id in timeOv)?timeOv[tk.id]:(tk.time||"");}
function dtypeOf(tk){return dtypeOv[tk.id]||'do';}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(s,n){const p=(s||todayStr()).split('-').map(Number);const d=new Date(p[0],p[1]-1,p[2]);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addMonths(s,n){const p=(s||todayStr()).split('-').map(Number);const d=new Date(p[0],p[1]-1,p[2]);d.setMonth(d.getMonth()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayDiff(s){const t=new Date();t.setHours(0,0,0,0);const p=s.split('-').map(Number);return Math.round((new Date(p[0],p[1]-1,p[2])-t)/86400000);}
function dLabel(s){const n=dayDiff(s);const p=s.split('-').map(Number);const dt=new Date(p[0],p[1]-1,p[2]);
 if(n===0)return'hoy';if(n===1)return'mañana';if(n===-1)return'ayer';
 if(n<-1)return'venció';
 if(n>1&&n<7)return dt.toLocaleDateString('es-MX',{weekday:'short'}).replace('.','')+' '+p[2];
 return dt.toLocaleDateString('es-MX',{day:'numeric',month:'short'}).replace('.','');}
/* colores del renglón según qué tan cerca está */
function tonoFecha(n){
 if(n<0) return {cls:'venc', bg:'#F6D9D0', tx:'var(--dantx)', lab:'venció'};
 if(n===0)return {cls:'hoy',  bg:'#EFCFBE', tx:'var(--acctx)', lab:'hoy'};
 if(n===1)return {cls:'man',  bg:'#E6D6B4', tx:'var(--ambtx)', lab:'mañana'};
 if(n<=7) return {cls:'',     bg:'var(--blubg)', tx:'var(--blutx)', lab:''};
 return       {cls:'',     bg:'var(--soft)',  tx:'var(--mut)',   lab:''};}
/* ---------- recurrencia ---------- */
const REPS=[['','No se repite'],['daily','Cada día'],['weekly','Cada semana'],
            ['biweekly','Cada 2 semanas'],['monthly','Cada mes'],['bimonthly','Cada 2 meses']];
function repLabel(rp){return {daily:'cada día',weekly:'cada semana',biweekly:'cada 2 semanas',
 monthly:'cada mes',bimonthly:'cada 2 meses'}[rp]||'';}
function repNext(rp,base){
 if(rp==='monthly')return addMonths(base,1);
 if(rp==='bimonthly')return addMonths(base,2);
 if(rp==='weekly')return addDays(base,7);
 if(rp==='biweekly')return addDays(base,14);
 return addDays(base,1);}
function overdue(tk){const d=dateOf(tk);return !!(d&&dayDiff(d)<0&&!state[tk.id]);}
function activo(tk){return !archived[tk.id]&&!state[tk.id];}
function doneToday(){const t=todayStr();return Object.values(doneLog).filter(d=>d===t).length;}

/* =======================================================================
   MIGRACIÓN — corre una sola vez. Nada se borra.
   ======================================================================= */
function migrar(){
 if(localStorage.getItem(MGKEY)==="1")return;
 const yaEsta=id=>short.some(e=>!e.free&&e.id===id);
 const nueva=[];
 // 1) los recordatorios: ya eran tu lista corta
 rmind.forEach(r=>{if(r&&r.t)nueva.push({free:true,id:"x"+Math.random().toString(36).slice(2,9),t:r.t,done:!!r.done});});
 // 2) los importantes, en el orden que tú les diste
 const tks=allTasks();const vivo=id=>tks.some(t=>t.id===id)&&!archived[id];
 impOrder.forEach(id=>{if(impSt[id]&&vivo(id)&&!yaEsta(id)&&!nueva.some(e=>e.id===id))nueva.push({id:id});});
 Object.keys(impSt).forEach(id=>{if(impSt[id]&&vivo(id)&&!nueva.some(e=>e.id===id))nueva.push({id:id});});
 // 3) lo que TÚ marcaste para hoy (no los "hoy" que traía la plantilla original,
 //    que son de hace meses y llenarían la lista de golpe)
 Object.keys(hoyOv).forEach(id=>{if(hoyOv[id]&&vivo(id)&&!state[id]&&!nueva.some(e=>e.id===id))nueva.push({id:id});});
 // 4) lo que estaba en la Bandeja, para que no se quede en un lugar que ya no visitas
 tks.forEach(tk=>{if(areaOf(tk)==='inbox'&&!archived[tk.id]&&!state[tk.id]&&!nueva.some(e=>e.id===tk.id))nueva.push({id:tk.id});});
 short=nueva;
 localStorage.setItem(MGKEY,"1");
 save();
}

function cortaVaciarGrises(){
 if(short.length<=TOPE)return;

 let movidas=0;
 fuera.forEach(e=>{
   if(e.free){ // se convierte en tarea de Sin clasificar
     const id="inbox|c|"+Date.now()+Math.floor(Math.random()*999);
     custom.push({id,area:"inbox",sg:"Por clasificar",t:e.t});

let sDrag=null;
function sDragStart(e){sDrag=+e.currentTarget.dataset.i;e.currentTarget.classList.add('dragging');
 try{e.dataTransfer.setData('text/plain',String(sDrag));e.dataTransfer.effectAllowed='move';}catch(x){}
 e.stopPropagation();}
function sDragEnd(e){e.currentTarget.classList.remove('dragging');
 document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));sDrag=null;}
function sDragOver(e){e.preventDefault();if(+e.currentTarget.dataset.i!==sDrag)e.currentTarget.classList.add('over');}
function sDragLeave(e){e.currentTarget.classList.remove('over');}
function sDrop(e){e.preventDefault();const to=+e.currentTarget.dataset.i;if(sDrag==null||sDrag===to)return;
 const it=short.splice(sDrag,1)[0];short.splice(to,0,it);save();render();}

/* ---------- vistas de la lista corta ---------- */
const VISTAS=[['libre','Libre'],['bloque','Por bloque'],['midia','Mi día'],['matriz','Matriz'],['horas','Por horas']];
function setShortView(v){shortView=v;localStorage.setItem('agenda_shortview',v);qeOpen=null;render();}
function cortaImp(i){const e=short[i];if(!e)return;e.imp=!e.imp;delete e.q;save();render();}
/* urgente = fecha vencida o dentro de 2 días */
function esUrgente(e){if(e.free)return false;const tk=tkById(e.id);if(!tk)return false;
 const d=dateOf(tk);if(!d)return false;const n=dayDiff(d);return n<=2;}
/* cuadrante: el que tú pusiste arrastrando gana sobre el automático */
function quadDe(e){if(e.q!=null)return e.q;
 const u=esUrgente(e),m=!!e.imp;return u&&m?0:(!u&&m?1:(u?2:3));}
function mtxDrop(ev,qi){ev.preventDefault();ev.currentTarget.classList.remove('over');
 if(sDrag==null)return;const e=short[sDrag];if(!e)return;
 e.q=qi;e.imp=(qi===0||qi===1);save();render();}
function mtxOver(ev){ev.preventDefault();ev.currentTarget.classList.add('over');}
function mtxLeave(ev){ev.currentTarget.classList.remove('over');}
function quadAuto(i){const e=short[i];if(!e)return;delete e.q;save();render();}

/* ---------- horas: leer y escribir sin abrir la tarea ---------- */
function horaDe(e){if(e.free)return e.hora||'';const tk=tkById(e.id);return tk?timeOf(tk):'';}
function setHora(i,v){const e=short[i];if(!e)return;v=(v||'').trim();
 if(e.free){if(v)e.hora=v;else delete e.hora;}
 else{if(v)timeOv[e.id]=v;else delete timeOv[e.id];}
 save();render();}
function horaEdit(i){qeHora=i;render();
 setTimeout(()=>{const el=document.getElementById('horaIn');if(el){el.focus();el.select();}},30);}
function horaKey(ev,i){if(ev.key==='Enter'){qeHora=null;setHora(i,ev.target.value);}
 else if(ev.key==='Escape'){qeHora=null;render();}}
function horaBlur(ev,i){qeHora=null;setHora(i,ev.target.value);}
/* arrastrar a un renglón con hora = tomar esa hora · soltar en "sin hora" = quitarla */
function hrDrop(ev,i){ev.preventDefault();ev.currentTarget.classList.remove('over');
 if(sDrag==null||sDrag===i)return;
 const destino=horaDe(short[i]);const j=sDrag;sDrag=null;setHora(j,destino);}
function sinHoraDrop(ev){ev.preventDefault();ev.currentTarget.classList.remove('over');
 if(sDrag==null)return;const j=sDrag;sDrag=null;setHora(j,'');}

/* ---------- arrastrar a otro bloque en la vista Por bloque ---------- */
function grpDrop(ev,areaKey){ev.preventDefault();ev.stopPropagation();ev.currentTarget.classList.remove('over');
 if(sDrag==null)return;const i=sDrag;sDrag=null;
 if(areaKey==='__libres')return;
 moverABloque(i,areaKey);}
/* el renglón de la lista corta número i se va al bloque (primera sección) */
function moverABloque(i,areaKey){const e=short[i];if(!e)return;const a=areaByKey(areaKey);if(!a)return;
 const sg=sgNames(a)[0];
 if(e.free){const id=areaKey+"|c|"+Date.now();custom.push({id,area:areaKey,sg,t:e.t});
   if(e.done)state[id]=true;short[i]={id:id,at:e.at||todayStr()};save();render();return;}
 const tk=tkById(e.id);if(!tk)return;
 if(tk.id.includes('|c|')){const cc=custom.find(x=>x.id===tk.id);if(cc){cc.area=areaKey;cc.sg=sg;}delete areaOv[tk.id];delete sgOv[tk.id];}
 else{areaOv[tk.id]=areaKey;sgOv[tk.id]=sg;}
 save();render();}
/* soltar sobre un renglón: si es de otro bloque, se muda a ese bloque; si es del mismo, se reordena */
function blqRowDrop(ev,i,k){ev.preventDefault();ev.stopPropagation();ev.currentTarget.classList.remove('over');
 if(sDrag==null||sDrag===i)return;
 const f=datosFila(short[sDrag]);const kd=f&&f.area?f.area.key:'__libres';
 if(kd!==k){const j=sDrag;sDrag=null;if(k!=='__libres')moverABloque(j,k);return;}
 sDrop(ev);}
/* al cajón desde la lista corta. Un pendiente suelto se vuelve tarea de Sin clasificar y se guarda. */
function archivarCorta(i){const e=short[i];if(!e)return;let id=e.id;
 if(e.free){id="inbox|c|"+Date.now();custom.push({id,area:"inbox",sg:"Por clasificar",t:e.t});
   if(e.done)state[id]=true;}
 archived[id]=Date.now();short.splice(i,1);save();render();}
function cajonDrop(ev){ev.preventDefault();ev.stopPropagation();ev.currentTarget.classList.remove('over');
 if(sDrag==null)return;const i=sDrag;sDrag=null;archivarCorta(i);}

/* ---------- editor rápido dentro de la lista ---------- */
let qeOpen=null, qeHora=null;
function toggleQE(id){qeOpen=(qeOpen===id)?null:id;qeHora=null;render();}
function qeFecha(i,v){const e=short[i];if(!e||e.free)return;
 if(v)dateOv[e.id]=v;else delete dateOv[e.id];delete e.q;save();render();}
function qeDur(i,di){const e=short[i];if(!e||e.free)return;
 timeSt[e.id]=di<0?"":DUR[di].t;save();render();}
function qeArea(i,ak){const e=short[i];if(!e)return;
 if(e.free){promIdx=i;const a=areaByKey(ak);const sg=sgNames(a)[0];
   const id=ak+"|c|"+Date.now();custom.push({id,area:ak,sg,t:e.t});
   if(e.done)state[id]=true;short[i]={id:id,at:e.at||todayStr()};promIdx=null;openAreas[ak]=true;save();render();return;}
 const tk=tkById(e.id);if(!tk)return;const a=areaByKey(ak);const sg=sgNames(a)[0];
 if(tk.id.includes('|c|')){const cc=custom.find(x=>x.id===tk.id);if(cc){cc.area=ak;cc.sg=sg;}delete areaOv[tk.id];delete sgOv[tk.id];}
 else{areaOv[tk.id]=ak;sgOv[tk.id]=sg;}
 save();render();}
function qeSg(i,sg){const e=short[i];if(!e||e.free)return;const tk=tkById(e.id);if(!tk)return;
 if(tk.id.includes('|c|')){const cc=custom.find(x=>x.id===tk.id);if(cc)cc.sg=sg;delete sgOv[tk.id];}
 else sgOv[tk.id]=sg;
 save();render();}
function editorRapido(e,i){
 const f=datosFila(e);if(!f)return"";
 const areaK=f.area?f.area.key:'';
 let opts=`<option value="">— sin bloque —</option>`;
 areas().forEach(a=>{opts+=`<option value="${a.key}" ${a.key===areaK?'selected':''}>${esc(a.name)}</option>`;});
 let sgOpts="";
 if(f.area){const cur=sgOf(f.tk);sgNames(f.area).forEach(s=>{sgOpts+=`<option value="${esc(s)}" ${s===cur?'selected':''}>${esc(labelOv[areaK+'|'+s]||s)}</option>`;});}
 const chips=DUR.map((d,k)=>`<button class="dchip ${f.dur===k?'on':''}" style="${f.dur===k?`background:${d.c};border-color:${d.c};color:#fff`:''}" onclick="qeDur(${i},${k})">${d.t}</button>`).join('')
   +`<button class="dchip ${f.dur<0?'on':''}" onclick="qeDur(${i},-1)">sin estimar</button>`;
 let h=`<div class="qe">`;
 if(!e.free){
   h+=`<div class="qerow"><label>Fecha</label><input type="date" value="${dateOf(f.tk)||''}" onchange="qeFecha(${i},this.value)"></div>`;
 }
 h+=`<div class="qerow"><label>Hora</label><input value="${esc(horaDe(e))}" placeholder="8 pm" onchange="setHora(${i},this.value)"></div>`;
 if(!e.free)h+=`<div class="qerow"><label>Cuánto me toma</label><div class="dchips">${chips}</div></div>`;
 h+=`<div class="qerow"><label>Bloque${f.area?' y sección':''}</label><div class="frow">`+
    `<select onchange="qeArea(${i},this.value)">${opts}</select>`+
    (f.area?`<select onchange="qeSg(${i},this.value)">${sgOpts}</select>`:'')+`</div></div>`;
 if(!e.free)h+=`<div class="qerow"><label></label><button class="mini" onclick="openDetail(null,'${e.id}')">Abrir la tarea completa</button></div>`;
 return h+`</div>`;}
function datosFila(e){
 if(e.free)return {texto:e.t,hecho:!!e.done,area:null,col:null,n:null,hora:'',dur:-1};
 const tk=tkById(e.id);if(!tk)return null;
 const a=areaObjOf(tk);const d=dateOf(tk);
 return {texto:txtOf(tk),hecho:!!state[tk.id],area:a,col:colOf(a),
         n:d?dayDiff(d):null,hora:timeOf(tk),dur:durOf(tk.id),tk:tk};}
function pastillaCuando(n){
 if(n===null||n>3)return"";
 const bg=n<=1?'var(--danbg)':n===2?'var(--accbg)':'var(--ambbg)';
 const tx=n<=1?'var(--dantx)':n===2?'var(--acctx)':'var(--ambtx)';
 return `<span class="tipo" style="background:${bg};color:${tx}">${n<0?'venció':n===0?'hoy':n===1?'mañana':n+' días'}</span>`;}
/* Todas las filas se arrastran. opts: num, reordena, pastillaArea, estrella, auto, hora */
function filaCorta(e,i,opts){
 const f=datosFila(e);if(!f)return"";
 const gris=(opts.gris&&i>=TOPE)?'faded':'';
 const reord=opts.grupo?` ondragover="sDragOver(event)" ondragleave="sDragLeave(event)" ondrop="blqRowDrop(event,${i},'${opts.grupo}')"`:
             opts.reordena?` ondragover="sDragOver(event)" ondragleave="sDragLeave(event)" ondrop="sDrop(event)"`:
             (opts.soltarHora?` ondragover="sDragOver(event)" ondragleave="sDragLeave(event)" ondrop="hrDrop(event,${i})"`:'');
 let h=`<div class="lcrow ${gris} ${f.hecho?'done':''}" draggable="true" data-i="${i}" ondragstart="sDragStart(event)" ondragend="sDragEnd(event)"${reord}>`;
 h+=`<span class="grip">⠿</span>`;
 if(opts.num)h+=`<span class="rnum">${i+1}</span>`;
 if(opts.estrella)h+=`<button class="star ${e.imp?'on':''}" title="Marcar como importante" onclick="cortaImp(${i})">${e.imp?'★':'☆'}</button>`;
 h+=`<span class="rc ${f.hecho?'on':''}" onclick="cortaToggle(${i})">${f.hecho?'✓':''}</span>`+
    ((opts.pastillaArea&&f.col)?`<span class="rdot" style="background:${f.col.sol}" title="${esc(f.area.name)}"></span>`:'')+
    (e.free?'':(opts.tgIni?tgIniHTML(e.id):tgPill(e.id)))+
    `<span class="rt" onclick="cortaEdit(${i})">${esc(f.texto)}</span>`;
 if(opts.hora!==false){
   const hv=horaDe(e);
   if(qeHora===i)h+=`<input class="hin" id="horaIn" value="${esc(hv)}" placeholder="8 pm" onkeydown="horaKey(event,${i})" onblur="horaBlur(event,${i})">`;
   else h+=`<button class="hchip ${hv?'':'vacia'}" title="Poner o cambiar la hora aquí mismo" onclick="horaEdit(${i})">${hv?esc(hv):'＋ hora'}</button>`;
 }
 h+=pastillaCuando(f.n);
 if(opts.auto&&e.q!=null)h+=`<button class="mini" title="Volver a acomodarla sola por su fecha" onclick="quadAuto(${i})">auto</button>`;
 h+=`<button class="qeb ${qeOpen===e.id?'on':''}" title="Cambiar fecha, hora, duración o bloque aquí mismo" onclick="toggleQE('${e.id}')">⋯</button>`;
 h+=`<span class="rx" title="Bajar de la lista" onclick="cortaDel(${i})">✕</span></div>`;
 if(qeOpen===e.id)h+=editorRapido(e,i);
 return h;}

function vistaLibre(){
 let r="";short.forEach((e,i)=>{r+=filaCorta(e,i,{num:1,reordena:1,pastillaArea:1,gris:1,hora:false});});
 return r;}
function vistaBloque(){
 const grupos=new Map();
 areas().forEach(a=>grupos.set(a.key,{area:a,col:colOf(a),items:[]}));
 grupos.set('__libres',{area:null,col:null,items:[]});
 short.forEach((e,i)=>{const f=datosFila(e);if(!f)return;
   const k=f.area?f.area.key:'__libres';
   if(!grupos.has(k))grupos.set(k,{area:f.area,col:f.col,items:[]});
   grupos.get(k).items.push({e,i});});
 let r="";
 grupos.forEach((g,k)=>{
   if(!g.items.length&&k!=='__libres')return;        // solo bloques con algo
   if(!g.items.length&&k==='__libres')return;
   const c=g.col||{sol:'var(--hint)',bg:'var(--soft)',tx:'var(--mut)'};
   r+=`<div class="grpH" style="color:${c.tx};border-bottom-color:${c.sol}" ondragover="sDragOver(event)" ondragleave="sDragLeave(event)" ondrop="grpDrop(event,'${k}')">`+
      `<span class="gdot" style="background:${c.sol}"></span>${esc(g.area?g.area.name:'Pendientes sueltos')}`+
      `<span class="gn">${g.items.length}</span></div>`;
   g.items.forEach(({e,i})=>{r+=filaCorta(e,i,{grupo:k,hora:false});});});
 /* destinos fijos: todos los bloques (aunque no tengan nada aquí) y el cajón */
 const dest=areas().filter(a=>!hiddenB[a.key]).map(a=>{const c=colOf(a);
   return `<span class="dchipB" ondragover="sDragOver(event)" ondragleave="sDragLeave(event)" ondrop="grpDrop(event,'${a.key}')"><span class="gdot" style="background:${c.sol}"></span>${esc(a.name)}</span>`;}).join('')+
   `<span class="dchipB caj" ondragover="sDragOver(event)" ondragleave="sDragLeave(event)" ondrop="cajonDrop(event)">🗃 al cajón</span>`;
 return r+`<div class="lcempty" style="margin-top:10px">Arrastra una tarea a otro bloque, arriba o aquí abajo. Al cajón se va aunque no tenga bloque.</div><div class="dests">${dest}</div>`;}
function vistaMatriz(){
 const Q=[
  {t:'Hazlo ya',        d:'urgente e importante',  bg:'var(--danbg)', tx:'var(--dantx)', items:[]},
  {t:'Agéndalo',        d:'importante, sin prisa', bg:'var(--grnbg)', tx:'var(--grntx)', items:[]},
  {t:'Sácatelo rápido', d:'urgente, no importante',bg:'var(--ambbg)', tx:'var(--ambtx)', items:[]},
  {t:'¿De verdad?',     d:'ni urgente ni importante',bg:'var(--soft)',tx:'var(--mut)',   items:[]}];
 short.forEach((e,i)=>{Q[quadDe(e)].items.push({e,i});});
 let r=`<div class="mtx">`;
 Q.forEach((q,qi)=>{
   r+=`<div class="mq" ondragover="mtxOver(event)" ondragleave="mtxLeave(event)" ondrop="mtxDrop(event,${qi})">`+
      `<div class="mqh" style="background:${q.bg};color:${q.tx}">${q.t}<span class="mqd">${q.d}</span></div>`;
   if(!q.items.length)r+=`<div class="lcempty" style="padding:10px 0">Suelta algo aquí</div>`;
   q.items.forEach(({e,i})=>{r+=filaCorta(e,i,{estrella:1,pastillaArea:1,auto:1,hora:false,tgIni:1});});
   r+=`</div>`;});
 r+=`</div><div class="lcempty" style="margin-top:8px">Arrastra entre cuadrantes para acomodarlas tú. Las que no muevas se acomodan solas por su fecha límite.</div>`;
 return r;}
function minutos(h){const m=String(h||'').match(/(\d+)(?::(\d+))?\s*(a\.?m\.?|p\.?m\.?)?/i);
 if(!m)return null;let hh=+m[1],mm=m[2]?+m[2]:0;const ap=(m[3]||'').toLowerCase().replace(/\./g,'');
 if(ap==='pm'&&hh<12)hh+=12;if(ap==='am'&&hh===12)hh=0;return hh*60+mm;}
function vistaHoras(){
 const con=[],sin=[];
 short.forEach((e,i)=>{const f=datosFila(e);if(!f)return;
   const mi=minutos(horaDe(e));(mi===null?sin:con).push({e,i,mi});});
 con.sort((a,b)=>a.mi-b.mi);
 let r="";
 con.forEach(({e,i,mi})=>{
   const hh=String(Math.floor(mi/60)).padStart(2,'0'),mm=String(mi%60).padStart(2,'0');
   r+=`<div class="hrrow"><span class="hrt">${hh}:${mm}</span>`+
      `<div class="hrb">${filaCorta(e,i,{pastillaArea:1,soltarHora:1})}</div></div>`;});
 r+=`<div class="grpH sinhora" style="color:var(--mut);border-bottom-color:var(--line2)" ondragover="sDragOver(event)" ondragleave="sDragLeave(event)" ondrop="sinHoraDrop(event)">`+
    `<span class="gdot" style="background:var(--line2)"></span>Sin hora<span class="gn">${sin.length}</span></div>`;
 sin.forEach(({e,i})=>{r+=filaCorta(e,i,{pastillaArea:1,reordena:1});});
 r+=`<div class="lcempty" style="margin-top:8px">Toca la hora de cualquier renglón para escribirla. Arrastra una tarea sobre otra para darle su misma hora, o al título "Sin hora" para quitársela.</div>`;
 return r;}

function renderShort(){
 const box=document.getElementById('shortBox');
 const tks=TK();
 short=short.filter(e=>e.free||tks.some(t=>t.id===e.id));   // limpia referencias muertas
 let rows;
 if(shortView==='bloque')rows=vistaBloque();
 else if(shortView==='midia')rows=vistaMiDia();
 else if(shortView==='matriz')rows=vistaMatriz();
 else if(shortView==='horas')rows=vistaHoras();
 else rows=vistaLibre();
 const aviso=(shortView==='libre'&&short.length>TOPE)?`<div class="full">Del ${TOPE+1} para abajo ya no lo estás viendo de verdad.<button class="mini" style="margin-left:auto" onclick="cortaVaciarGrises()">Mandarlos a sus áreas</button></div>`:"";
 const vacio=short.length?"":`<div class="lcempty">Aquí va lo que de verdad importa ahorita. Escribe cualquier cosa arriba, o toca la ↑ de una tarea.</div>`;
 const sw=VISTAS.map(([v,l])=>`<button class="vb ${shortView===v?'on':''}" onclick="setShortView('${v}')">${l}</button>`).join('');
 box.innerHTML=`<div class="pnlh" style="cursor:default"><span class="ph" style="background:var(--accbg);color:var(--acctx)">Lo que importa ahorita</span><span class="n">${short.length}</span></div>`+
  `<div class="vsw">${sw}</div>`+
  `<input class="add" id="cortaInput" placeholder="＋ escribe lo que sea y Enter" onkeydown="cortaAdd(event)" style="margin-bottom:4px">`+
  rows+vacio+aviso;
}

/* =======================================================================
   AHORA — tarjeta de lo que estás haciendo y franja del día (tipo Tiimo)
   Usa las tareas con fecha de HOY y hora, más los sueltos de «importa ahorita» con hora.
   Sin duración: cuenta como 30 min para saber cuándo termina.
   ======================================================================= */
const DIA_INI=8*60,DIA_FIN=22*60,SIN_DUR=30;
function fmtHora(m){m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mi=m%60,ap=h<12?'am':'pm',h12=(h%12)||12;
 return h12+(mi?':'+String(mi).padStart(2,'0'):'')+' '+ap;}
function itemsHoy(){
 const hoy=todayStr(),out=[];
 TK().forEach(tk=>{if(!activo(tk)||dateOf(tk)!==hoy)return;const ini=minutos(timeOf(tk));if(ini==null)return;
   const d=minutosDe(tk.id);out.push({id:tk.id,t:txtOf(tk),ini,d,fin:ini+(d||SIN_DUR),col:colOf(areaObjOf(tk)).sol});});
 short.forEach((e,i)=>{if(!e.free||e.done||!e.hora)return;const ini=minutos(e.hora);if(ini==null)return;
   out.push({id:'suelto:'+i,t:e.t,ini,d:null,fin:ini+SIN_DUR,col:'#8A7263',suelto:i});});
 return out.sort((a,b)=>a.ini-b.ini);}
function ahoraMin(){const d=new Date();return d.getHours()*60+d.getMinutes();}
function yaTermine(id){if(id.indexOf('suelto:')===0){cortaToggle(+id.slice(7));return;}toggle(id);}
function abreItem(id){if(id.indexOf('suelto:')===0)return;openDetail(null,id);}
function renderAhora(){
 const box=document.getElementById('ahoraBox'),dia=document.getElementById('diaBox');if(!box||!dia)return;
 const its=itemsHoy(),n=ahoraMin();
 if(!its.length){box.innerHTML='';dia.style.display='none';return;}
 /* tarjeta */
 const cur=its.find(x=>x.ini<=n&&n<x.fin),sig=its.find(x=>x.ini>n);
 let h='';
 if(cur){
   const quedan=cur.fin-n,pct=Math.min(100,Math.round((n-cur.ini)/(cur.fin-cur.ini)*100));
   const grande=quedan<60?`${quedan}<small>min</small>`:`${Math.floor(quedan/60)}:${String(quedan%60).padStart(2,'0')}<small>h</small>`;
   h=`<div class="ahora"><div class="ahtop"><div class="ahtx" onclick="abreItem('${cur.id}')"><div class="ahcap">Ahora · ${fmtHora(cur.ini)} a ${fmtHora(cur.fin)}${cur.d?'':' · sin duración'}</div>`+
     `<div class="ahnom">${esc(cur.t)}</div></div><div class="ahnum">${grande}</div></div>`+
     `<div class="ahbar"><i style="width:${pct}%"></i></div>`+
     `<div class="ahpie"><span>${sig?'Sigue: '+esc(sig.t)+' · '+fmtHora(sig.ini):'Es lo último con hora de hoy'}</span>`+
     `<button class="mini" onclick="yaTermine('${cur.id}')">✓ ya terminé</button></div></div>`;
 }else if(sig){
   const falta=sig.ini-n;
   const grande=falta<60?`${falta}<small>min</small>`:`${Math.floor(falta/60)}:${String(falta%60).padStart(2,'0')}<small>h</small>`;
   h=`<div class="ahora"><div class="ahtop"><div class="ahtx" onclick="abreItem('${sig.id}')"><div class="ahcap">Sigue · ${fmtHora(sig.ini)}${sig.d?' · '+fmtDur(sig.d):''}</div>`+
     `<div class="ahnom">${esc(sig.t)}</div></div><div class="ahnum">${grande}<em>para empezar</em></div></div></div>`;
 }
 box.innerHTML=h;
 /* franja del día */
 const ini=Math.min(diaIni(),Math.floor(its[0].ini/60)*60),fin=Math.max(diaFin(),Math.ceil(its[its.length-1].fin/60)*60),span=fin-ini;
 const pos=m=>((m-ini)/span*100).toFixed(2)+'%';

   seg+=`<i class="dseg ${x.d?'':'sind'}" title="${esc(fmtHora(x.ini)+' · '+x.t)}" onclick="abreItem('${x.id}')" style="left:${pos(x.ini)};width:${x.d?w.toFixed(2)+'%':'3px'};background:${x.col};opacity:${esta?1:pas?.25:.55}"></i>`;});
 let marcas='';for(let m=Math.ceil(ini/120)*120;m<=fin;m+=120)marcas+=`<span style="left:${pos(m)}">${fmtHora(m).replace(':00','')}</span>`;

   `<div class="dtrack">${seg}${raya}</div><div class="dmarcas">${marcas}</div>`;

/* =======================================================================
   MI DÍA — armar el día en una línea de tiempo (tipo Structured)
   Acomodar una tarea = ponerle fecha de HOY y esa hora (así la tarjeta «Ahora»,
   la franja, el widget y los avisos la toman solos). Quitarla del día regresa
   la fecha y hora que tenía antes (midia.prev).
   midia = {ini, fin, prev:{id:{d,h}}, extra:{f, ids:[]}, no:{f, ids:[]}}
   ======================================================================= */
const MIN_HUECO=15;
let mdHueco=null,mdPicker=false,mdPickA=null,pDrag=null;
function diaIni(){return midia.ini!=null?midia.ini:8*60;}
function diaFin(){return midia.fin!=null?midia.fin:22*60;}
function mdHoyLista(k){const h=todayStr();const o=midia[k];return (o&&o.f===h)?o.ids:[];}
function mdSetLista(k,ids){midia[k]={f:todayStr(),ids};}
/* lo que ya está en el día (con hora de hoy), incluidas las hechas */
function planHoy(){
 const hoy=todayStr(),out=[];
 TK().forEach(tk=>{if(archived[tk.id]||dateOf(tk)!==hoy)return;const ini=minutos(timeOf(tk));if(ini==null)return;
   const d=minutosDe(tk.id);const a=areaObjOf(tk);
   out.push({k:tk.id,t:txtOf(tk),ini,d,fin:ini+(d||SIN_DUR),c:colOf(a),b:a?a.name:'',hecho:!!state[tk.id]});});
 short.forEach((e,i)=>{if(!e.free||!e.hora)return;const ini=minutos(e.hora);if(ini==null)return;
   out.push({k:'suelto:'+i,t:e.t,ini,d:null,fin:ini+SIN_DUR,c:{sol:'#8A7263',bg:'#EDE5DF',tx:'#5A4437'},b:'Pendiente suelto',hecho:!!e.done});});
 return out.sort((a,b)=>a.ini-b.ini);}
/* la bandeja «Por acomodar», por grupos y sin repetir */
function bandeja(){
 const hoy=todayStr(),ya=new Set(planHoy().map(x=>x.k)),no=new Set(mdHoyLista('no')),vistos=new Set();
 const item=(k,t,d,c,extra)=>Object.assign({k,t,d,c},extra||{});
 const deTk=(tk,extra)=>{const a=areaObjOf(tk);return item(tk.id,txtOf(tk),minutosDe(tk.id),colOf(a),Object.assign({b:a?a.name:''},extra));};
 const pasa=k=>!ya.has(k)&&!no.has(k)&&!vistos.has(k)&&(vistos.add(k),true);
 const g=[{n:'De lo que importa ahorita',it:[]},{n:'Ya venció',it:[]},{n:'Con fecha de hoy, sin hora',it:[]},{n:'Elegidas de tus bloques',it:[]}];
 short.forEach((e,i)=>{
   if(e.free){if(!e.done&&!e.hora&&pasa('suelto:'+i))g[0].it.push(item('suelto:'+i,e.t,null,{sol:'#8A7263'},{b:'Pendiente suelto'}));return;}
   const tk=tkById(e.id);if(tk&&activo(tk)&&pasa(tk.id))g[0].it.push(deTk(tk));});
 /* lo vencido del último mes, lo más reciente primero, máximo 8 */
 TK().filter(t=>activo(t)&&dateOf(t)&&dayDiff(dateOf(t))<0&&dayDiff(dateOf(t))>=-30).sort((a,b)=>dayDiff(dateOf(b))-dayDiff(dateOf(a)))
   .forEach(tk=>{if(g[1].it.length<8&&pasa(tk.id))g[1].it.push(deTk(tk,{tag:dLabel(dateOf(tk))}));});
 TK().filter(t=>activo(t)&&dateOf(t)===hoy&&minutos(timeOf(t))==null).forEach(tk=>{if(pasa(tk.id))g[2].it.push(deTk(tk));});
 mdHoyLista('extra').forEach(id=>{const tk=tkById(id);if(tk&&activo(tk)&&pasa(id))g[3].it.push(deTk(tk));});
 return g.filter(x=>x.it.length);}
/* huecos entre lo acomodado (desde ahora si ya empezó el día) */
function huecos(){
 const plan=planHoy().filter(x=>!x.hecho),n=ahoraMin();let desde=Math.max(diaIni(),Math.ceil(n/5)*5);const out=[];
 plan.forEach(x=>{if(x.fin<=desde)return;if(x.ini-desde>=MIN_HUECO)out.push({ini:desde,fin:x.ini});desde=Math.max(desde,x.fin);});
 if(diaFin()-desde>=MIN_HUECO)out.push({ini:desde,fin:diaFin()});
 return out;}
/* poner en el día a una hora */
function colocar(k,ini){
 if(!midia.prev)midia.prev={};
 if(k.indexOf('suelto:')===0){const e=short[+k.slice(7)];if(!e)return;e.hora=fmtHora(ini);}
 else{if(!(k in midia.prev))midia.prev[k]={d:(k in dateOv)?dateOv[k]:null,h:(k in timeOv)?timeOv[k]:null};
   dateOv[k]=todayStr();timeOv[k]=fmtHora(ini);}
 mdHueco=null;save();render();}
/* tocar una de la bandeja: al primer hueco donde quepa (si no cabe en ninguno, al final del día) */
function colocarSola(k){const d=(k.indexOf('suelto:')===0?null:minutosDe(k))||SIN_DUR;
 const h=huecos().find(x=>x.fin-x.ini>=d);
 if(h){colocar(k,h.ini);return;}
 const plan=planHoy();const fin=plan.length?Math.max(...plan.map(x=>x.fin)):Math.max(diaIni(),ahoraMin());
 colocar(k,Math.ceil(fin/5)*5);toast('No cabía en ningún hueco: la puse al final del día.');}
/* quitar del día: regresa la fecha y hora de antes */
function quitarDelDia(k){
 if(k.indexOf('suelto:')===0){const e=short[+k.slice(7)];if(e)delete e.hora;save();render();return;}
 const p=(midia.prev||{})[k];
 if(p){if(p.d==null)delete dateOv[k];else dateOv[k]=p.d;if(p.h==null)delete timeOv[k];else timeOv[k]=p.h;delete midia.prev[k];}
 else delete timeOv[k];      // ya tenía fecha de hoy desde antes: solo se le quita la hora
 save();render();}
function hechoDia(k){if(k.indexOf('suelto:')===0){cortaToggle(+k.slice(7));return;}toggle(k);}
function hoyNo(k){mdSetLista('no',mdHoyLista('no').concat([k]));save();render();}
function elegirDeBloque(id,on){let l=mdHoyLista('extra').filter(x=>x!==id);if(on)l.push(id);mdSetLista('extra',l);save();render();}
function setHorario(q,v){midia[q]=+v;save();render();}
function pDragStart(e){pDrag=e.currentTarget.dataset.k;e.currentTarget.classList.add('dragging');}
function pDragEnd(e){e.currentTarget.classList.remove('dragging');pDrag=null;document.querySelectorAll('.mdgap.over').forEach(x=>x.classList.remove('over'));}
function gapOver(e){if(!pDrag)return;e.preventDefault();e.currentTarget.classList.add('over');}
function gapLeave(e){e.currentTarget.classList.remove('over');}

 /* línea de tiempo: lo acomodado y los huecos, en orden */

   else{const g=f.g;const abierto=mdHueco===f.i;const cabe=g.fin-g.ini;

       tl+=`<div class="mdsug"><div class="mdsugh">Cabe en ${fmtDur(cabe)}</div>`+

          :`<div class="lcempty">Nada de la bandeja cabe aquí. Puedes dejarlo libre.</div>`)+`</div>`;}}});
 if(!filas.length)tl=`<div class="lcempty">Tu día está vacío. Toca algo de «Por acomodar» y se pone en el primer hueco.</div>`;
 /* bandeja */

 if(!bd)bd=`<div class="lcempty">No hay nada pendiente por acomodar.</div>`;
 /* elegir de cada bloque */

 if(mdPicker){const ext=new Set(mdHoyLista('extra'));

       (abierto?ts.map(t=>`<label class="mdpt"><input type="checkbox" ${ext.has(t.id)?'checked':''} onchange="elegirDeBloque('${t.id}',this.checked)"><span>${esc(txtOf(t))}</span></label>`).join(''):'');}).join('')+`</div>`;}
 box.innerHTML=

  `<div class="ahbar"><i style="width:${Math.min(100,pct)}%;background:${tono}"></i></div></div>`+

/* =======================================================================
   MODO AHORA
   ======================================================================= */
function parseDT(tk){const d=dateOf(tk);const tt=timeOf(tk);if(!d)return null;const p=d.split('-').map(Number);
 if(!tt)return null;
 const m=String(tt).match(/(\d+)(?::(\d+))?\s*(a\.?m\.?|p\.?m\.?)?/i);if(!m)return null;
 let h=+m[1],mi=m[2]?+m[2]:0;const ap=(m[3]||'').toLowerCase().replace(/\./g,'');
 if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;
 return new Date(p[0],p[1]-1,p[2],h,mi);}

function renderCd(){

 let best=null,bt=null;
 TK().forEach(tk=>{if(!activo(tk))return;const dt=parseDT(tk);if(dt&&dt>now&&(!bt||dt<bt)){bt=dt;best=tk;}});
 if(!best){box.innerHTML="";return;}
 const diff=bt-now,hrs=diff/3600000;
 const dd=dayDiff(dateOf(best));               // días de calendario, no horas sueltas
 const h=Math.floor(diff/3600000),mn=Math.floor((diff%3600000)/60000);
 const cuando=dd>1?('el '+dLabel(dateOf(best))+' a las '+timeOf(best))
   :dd===1?('mañana a las '+timeOf(best))
   :(h>0?('en '+h+' h'+(mn?' '+mn+' min':'')):('en '+mn+' min'));
 const cls=(dd===0&&hrs<6)?'dan':(dd===0?'amb':'blu');
 box.innerHTML=`<div class="alert ${cls}" onclick="openDetail(null,'${best.id}')" style="cursor:pointer">${esc(txtOf(best))} · ${cuando}</div>`;
}

   let cuerpo;

/* mover un paso un lugar arriba o abajo dentro de su sección */
function pasoMover(areaKey,sgEnc,id,dir){
 const sg=decodeURIComponent(sgEnc);const items=tasksFor(areaKey,sg);const i=items.findIndex(t=>t.id===id),j=i+dir;
 if(i<0||j<0||j>=items.length)return;
 let ord=(areaOrder[areaKey]||[]).slice();
 TK().filter(t=>areaOf(t)===areaKey).forEach(t=>{if(ord.indexOf(t.id)<0)ord.push(t.id);});   // los que no tenían lugar
 // el orden de la sección manda: se reacomodan sus ids en los lugares que ya ocupaban
 const sec=items.map(t=>t.id);const tmp=sec[i];sec[i]=sec[j];sec[j]=tmp;
 const lugares=ord.map((x,k)=>sec.indexOf(x)>=0?k:-1).filter(k=>k>=0);
 lugares.forEach((k,n)=>{ord[k]=sec[n];});
 areaOrder[areaKey]=ord;save();render();}

/* ---------- orden de los bloques ---------- */
/* los que se ven en la pantalla de Todo (los ocultos y "Sin clasificar" vacío no cuentan) */
function bloquesVisibles(){return areas().filter(a=>{if(hiddenB[a.key])return false;
 if(a.inbox&&!TK().some(t=>areaOf(t)===a.key&&!archived[t.id]))return false;return true;}).map(a=>a.key);}
/* pone "k" justo antes de "antes" (o al final) y guarda el orden completo */
function colocaBloque(k,antes){const todos=areas().map(a=>a.key).filter(x=>x!==k);
 const i=antes?todos.indexOf(antes):-1;if(i<0)todos.push(k);else todos.splice(i,0,k);
 blockOrder=todos;save();render();}
function moverBloque(ev,k,dir){ev.stopPropagation();const vis=bloquesVisibles();const i=vis.indexOf(k),j=i+dir;
 if(i<0||j<0||j>=vis.length)return;
 colocaBloque(k,dir<0?vis[j]:(vis[j+1]||null));}
let bDrag=null;
function bDragStart(e){bDrag=e.currentTarget.dataset.bk;e.currentTarget.classList.add('dragging');}
function bDragEnd(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.ach.over').forEach(x=>x.classList.remove('over'));bDrag=null;}
function bDragOver(e){if(!bDrag)return;e.preventDefault();if(e.currentTarget.dataset.bk!==bDrag)e.currentTarget.classList.add('over');}
function bDragLeave(e){e.currentTarget.classList.remove('over');}
function bDrop(e){if(!bDrag)return;e.preventDefault();e.stopPropagation();const k=bDrag,dest=e.currentTarget.dataset.bk;bDrag=null;
 e.currentTarget.classList.remove('over');if(!dest||dest===k)return;
 const vis=bloquesVisibles();   // soltarlo sobre un bloque de más abajo lo deja después de él; de más arriba, antes
 colocaBloque(k,vis.indexOf(k)<vis.indexOf(dest)?(vis[vis.indexOf(dest)+1]||null):dest);}
