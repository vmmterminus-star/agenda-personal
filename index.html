let tDrag=null;
function tDragStart(e){tDrag=e.currentTarget.dataset.id;e.currentTarget.classList.add('dragging');e.stopPropagation();}
function tDragEnd(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.over,.drop').forEach(x=>x.classList.remove('over','drop'));tDrag=null;}
function tDragOver(e){e.preventDefault();e.stopPropagation();if(e.currentTarget.dataset.id!==tDrag)e.currentTarget.classList.add('over');}
function tDragLeave(e){e.currentTarget.classList.remove('over');}
function tDrop(e){e.preventDefault();e.stopPropagation();const target=e.currentTarget.dataset.id;if(!tDrag||tDrag===target)return;
 const tk=tkById(tDrag),tt=tkById(target);if(!tk||!tt)return;if(areaOf(tk)!==areaOf(tt))return;
 sgOv[tDrag]=sgOf(tt);
 let ord=areaOrder[areaOf(tk)]||TK().filter(t=>areaOf(t)===areaOf(tk)).map(t=>t.id);
 const bajando=ord.indexOf(tDrag)>=0&&ord.indexOf(tDrag)<ord.indexOf(target);   // hacia abajo queda después del destino
 ord=ord.filter(x=>x!==tDrag);let ti=ord.indexOf(target);if(ti<0)ti=ord.length;else if(bajando)ti++;ord.splice(ti,0,tDrag);
 areaOrder[areaOf(tk)]=ord;save();render();}
function sgDragOver(e){e.preventDefault();e.currentTarget.classList.add('drop');}
function sgDragLeave(e){e.currentTarget.classList.remove('drop');}
function sgDrop(e){e.preventDefault();e.currentTarget.classList.remove('drop');
 const area=e.currentTarget.dataset.area,sg=decodeURIComponent(e.currentTarget.dataset.sg);
 const tk=tkById(tDrag);if(!tk)return;
 if(tk.id.includes('|c|')){const c=custom.find(x=>x.id===tDrag);if(c){c.area=area;c.sg=sg;}delete sgOv[tDrag];delete areaOv[tDrag];}
 else{if(tk.area!==area)return;sgOv[tDrag]=sg;}
 let ord=(areaOrder[area]||TK().filter(t=>areaOf(t)===area).map(t=>t.id)).filter(x=>x!==tDrag);ord.push(tDrag);
 areaOrder[area]=ord;save();render();}

function archLeave(e){e.currentTarget.classList.remove('drop');}
function archDrop(e){e.preventDefault();e.currentTarget.classList.remove('drop');
 if(sDrag!=null){const i=sDrag;sDrag=null;archivarCorta(i);return;}   // viene de la lista corta
 if(!tDrag)return;archived[tDrag]=Date.now();short=short.filter(x=>x.free||x.id!==tDrag);save();render();}

function saveDetail(id){
 guardaBorrador();const tk=tkById(id);if(!tk)return;
 if(borrador.t!==undefined){const v=borrador.t.trim();
   if(v&&v!==tk.t)textOv[id]=v;else delete textOv[id];
   if(id.includes('|c|')){const c=custom.find(x=>x.id===id);if(c&&v)c.t=v;}}
 if(borrador.d!==undefined){const v=borrador.d.trim();if(v)desc[id]=v;else delete desc[id];}
 if(borrador.dd!==undefined){if(borrador.dd)dateOv[id]=borrador.dd;else delete dateOv[id];}
 if(borrador.h!==undefined){const v=borrador.h.trim();if(v)timeOv[id]=v;else delete timeOv[id];}
 if(borrador.dm!==undefined){const m=leeDur(borrador.dm);
   if(m){durMin[id]=m;   // y el escalón más cercano, para el color de la barrita
     let k=0;STEPMIN.forEach((x,j)=>{if(x&&Math.abs(x-m)<Math.abs(STEPMIN[k]-m))k=j;});timeSt[id]=DUR[k].t;}
   else delete durMin[id];}
 if(borrador.r!==undefined){if(borrador.r)repeatOv[id]=borrador.r;else delete repeatOv[id];}
 if(borrador.ty!==undefined)dtypeOv[id]=borrador.ty;
 if(borrador.a!==undefined){const ak=borrador.a,sgv=borrador.s;
   if(id.includes('|c|')){const c=custom.find(x=>x.id===id);if(c){c.area=ak;if(sgv)c.sg=sgv;}delete areaOv[id];delete sgOv[id];}
   else{if(ak!==tk.area)areaOv[id]=ak;else delete areaOv[id];if(sgv)sgOv[id]=sgv;}}
 if(borrador.g!==undefined){if(borrador.g&&tagById(borrador.g))tagOv[id]=borrador.g;else delete tagOv[id];}
 if(borrador.del!==undefined)delegSt[id]=borrador.del;
 borrador={};closeModal();save();render();}

/* ---------- widgets del iPhone: el script de Scriptable guardado aquí ----------
   El script vive al final de la página, en el bloque de texto con id "scriptableSrc"
   (copia de scriptable/mi-agenda-widget.js; se actualiza con scriptable/embeber.sh).
   Tu código secreto se le pone al momento de copiar, sacado de este dispositivo:
   nunca queda escrito en la página pública. */
const URL_PUB='https://vmmterminus-star.github.io/agenda-personal/';
let wgOpen=false,wgB1='',wgB2='';
function wgToggle(){wgOpen=!wgOpen;pintaMenu();}
function wgBloques(){return areas().filter(a=>!a.inbox&&!hiddenB[a.key]);}
function wgNombre(k,i){const a=areaByKey(k)||wgBloques()[i]||wgBloques()[0];return a?a.name:'Casa';}
function copiarTexto(t,msg){
 const ok=()=>{const el=document.getElementById('wgMsg');if(el)el.textContent=msg||'✓ copiado';};
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,()=>viejo());}else viejo();
 function viejo(){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
   document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(e){}ta.remove();}}
function wgCopiarScript(){
 if(!syncCode){const el=document.getElementById('wgMsg');if(el)el.textContent='Primero conecta tu código secreto arriba, en Respaldo.';return;}
 const src=document.getElementById('scriptableSrc').textContent.replace(/^\s+/,'');
 const url=location.protocol==='https:'?location.origin+location.pathname:URL_PUB;
 copiarTexto(src.replace('__CODIGO__',syncCode.replace(/"/g,'\\"')).replace('__URL__',url),
   '✓ Script copiado. En Scriptable: ＋, pega, y nómbralo mi-agenda-widget.');}
/* miniaturas: dibujitos del acomodo de cada widget */

 const two=(a,b)=>`<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px">${col(a)}${col(b)}</div>`;

 let x=`<i style="display:block;height:6px;width:30px;border-radius:3px;background:var(--accbg)"></i>`;
 if(tipo==='hoy')x+=h('#C97B5A')+tag(80)+tag(65)+h('#7A6A8C')+tag(75)+h('#A79E92')+r(60);
 else if(tipo==='hoy:b')x+=h('#C97B5A')+r(85)+r(70)+h('#7A6A8C')+r(80)+h('#A79E92')+r(60)+r(50);
 else if(tipo==='hoy:c')x+=two(h('#C97B5A')+r(90)+r(70)+r(80),h('#7A6A8C')+r(85)+h('#A79E92')+r(70));
 else if(tipo==='bloque')x+=h('#C97B5A')+sec('#F4E2D9')+tag(80)+tag(65)+sec('#F4E2D9')+tag(70);
 else if(tipo==='bloque2')x+=h('#C97B5A')+two(sec('#F4E2D9')+r(90)+r(70)+sec('#F4E2D9')+r(80),sec('#F4E2D9')+r(85)+r(60));
 else if(tipo==='bloques')x+=two(h('#C97B5A')+sec('#F4E2D9')+r(90)+r(70),h('#A98545')+sec('#F0E8D8')+r(85)+r(60));
 else if(tipo==='cal')x+=`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px">${Array.from({length:21},(_,i)=>`<i style="display:block;height:3px;border-radius:1px;background:${i===12?'#C97B5A':'#DDD5C9'}"></i>`).join('')}</div>`+r(35,'#C9A58F')+r(85)+r(70);
 else if(tipo==='cal:b')x+=`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1.5px">${Array.from({length:7},(_,i)=>`<i style="height:9px;border-radius:2px;border:0.5px solid ${i?'var(--line2)':'#C97B5A'};background:${i?'#fff':'var(--accbg)'}"></i>`).join('')}</div>`+r(35,'#C9A58F')+r(85)+r(70);
 else x+=r(35,'#C9A58F')+r(90)+r(70)+r(35,'#C9A58F')+r(85)+r(35,'#C9A58F')+r(65);
 return `<div class="wgmini">${x}</div>`;}

 return `<div class="pnl"><div class="pnlh" onclick="wgToggle()"><span class="ph" style="background:var(--accbg);color:var(--acctx)">Widgets del iPhone</span><span class="ar">${wgOpen?'▾':'▸'}</span></div>`+

/* una fila centrada a lo ancho */
function centrada(st) { const r = st.addStack(); r.layoutHorizontally(); r.addSpacer(); const c = r.addStack(); c.layoutHorizontally(); r.addSpacer(); return c; }
function semanasDelMes() { const h = new Date(), ini = (new Date(h.getFullYear(), h.getMonth(), 1).getDay() + 6) % 7; return Math.ceil((ini + new Date(h.getFullYear(), h.getMonth() + 1, 0).getDate()) / 7); }

function mes(st, d, extra) {

  const cw = Math.floor((ANCHO - 2 * PAD) / 7), rh = 17 + extra;

      texto(num, n, esHoy ? F.b(10.5) : F.r(10.5), esHoy ? K.acctx : K.txt);
      const pr = c.addStack(); pr.size = new Size(cw, 4); pr.centerAlignContent(); pr.spacing = 1.5;
      (puntos[n] || []).slice(0, 3).forEach(cc => punto(pr, cc, 3));
    }
  }
  return altoMes(extra);
}
function tira(st, d) {
  const cw = Math.floor((ANCHO - 2 * PAD - 18) / 7);
  const r = centrada(st); r.spacing = 3;
  for (let i = 0; i < 7; i++) {
    const f = new Date(); f.setDate(f.getDate() + i);
    const iso = f.getFullYear() + "-" + String(f.getMonth() + 1).padStart(2, "0") + "-" + String(f.getDate()).padStart(2, "0");
    const n = (d.cal || []).filter(x => x.f === iso).length;
    const c = r.addStack(); c.size = new Size(cw, 44); c.layoutVertically(); c.centerAlignContent(); c.cornerRadius = 7;
    c.borderWidth = 1; c.borderColor = i === 0 ? K.acc : K.linea; if (i === 0) c.backgroundColor = K.accbg;
    const a = c.addStack(); a.size = new Size(cw, 11); a.centerAlignContent(); texto(a, DIAS[f.getDay()], F.r(9.5), K.mut);
    const b = c.addStack(); b.size = new Size(cw, 17); b.centerAlignContent(); texto(b, f.getDate(), F.b(14), i === 0 ? K.acctx : K.txt);
    const p = c.addStack(); p.size = new Size(cw, 6); p.centerAlignContent(); p.spacing = 2;
    for (let k = 0; k < Math.min(n, 3); k++) punto(p, "#8A4529", 4);
  }
  return 44 + 3;
}
function wCal(w, d, v) {
  encabezado(w, d, "calendario");
  const evs = eventos(d), GAP = 12;
  let alto = ALTO - 2 * PAD - H.enc;
  const lista = Math.max(altoLista(evs), H.fila);
  if (v === "a") {
    // si la lista es corta, el calendario crece para no dejar hueco abajo
    const sobra = alto - altoMes(0) - GAP - 3 - lista - H.mas;
    const extra = sobra > 0 ? Math.min(10, Math.floor(sobra * 0.7 / semanasDelMes())) : 0;
    alto -= mes(w, d, extra);
  } else if (v === "b") alto -= tira(w, d);
  if (v !== "c") { w.addSpacer(GAP); alto -= GAP + 3; }
  // lo que todavía sobre se reparte entre los días de la lista
  const dias_ = new Set(evs.map(x => x.f)).size;
  const resto = alto - lista - H.mas;
  const aire = resto > 0 && dias_ > 1 ? Math.min(8, Math.floor(resto / (dias_ - 1))) : 0;
  pintaLista(w, evs, alto, aire);
}

/* ---------- pantalla de bloqueo: solo el número ---------- */
function wBloqueo(w, d) {
  const n = d.cortaN != null ? d.cortaN : (d.corta || []).length;
  if (FAM === "accessoryCircular") { const x = w.addText(String(n)); x.font = F.b(22); x.centerAlignText(); return; }
  const x = w.addText("Importa ahorita: " + n); x.font = F.sb(14);
  if (d.atrasadas) { const y = w.addText(d.atrasadas + " vencidas"); y.font = F.r(12); }
}

/* ---------- arranque ---------- */
const raw = (typeof args !== "undefined" && args.widgetParameter ? String(args.widgetParameter) : "").trim();
function queWidget(p) {
  const m = p.match(/^\s*(hoy|cal|bloques|bloque2|bloque)\s*(?::\s*(.*))?$/i);
  if (!p) return { tipo: "hoy", v: "a" };
  if (!m) { const ns = p.split(","); return { tipo: "bloque", v: ns.length > 1 ? "c" : "a", nombres: ns }; }
  const tipo = m[1].toLowerCase(), resto = (m[2] || "").trim();
  if (tipo === "hoy" || tipo === "cal") return { tipo, v: (resto.toLowerCase().charAt(0) || "a") };
  if (tipo === "bloques") return { tipo: "bloque", v: "c", nombres: resto.split(",") };
  return { tipo: "bloque", v: tipo === "bloque2" ? "b" : "a", nombres: [resto] };
}

const d = await traer();
const w = new ListWidget();
w.backgroundColor = K.fondo;
w.setPadding(PAD, PAD, PAD, PAD);
w.spacing = 3;
w.url = URL_AGENDA;
w.refreshAfterDate = new Date(Date.now() + 15 * 60 * 1000);

if (!d) {
  linea(w, "Sin datos todavía", F.sb(13), K.txt);
  linea(w, "Abre la agenda con tu código conectado para que publique el resumen.", F.r(11), K.mut, 3);
} else if (FAM.indexOf("accessory") === 0) {
  wBloqueo(w, d);
} else {
  const q = queWidget(raw);
  if (q.tipo === "cal") wCal(w, d, q.v);
  else if (q.tipo === "bloque") wBloque(w, d, q.nombres, q.v);
  else wHoy(w, d, q.v);
  w.addSpacer(); // todo pegado arriba; si sobra espacio, sobra abajo
}

// tocar el widget abre la agenda (w.url). Correrlo en Scriptable enseña cómo se ve.
if (config.runsInWidget) Script.setWidget(w);
else await w.presentLarge();
Script.complete();
</script>
